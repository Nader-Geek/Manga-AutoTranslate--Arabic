<!DOCTYPE html>
<!-- v1.14.58: دو فیکسِ نمایشگر — ① «دیباگ میزنم از نمایش زنده در میاد»: سوئیچِ 🔍
     قبلاً همهٔ DOM را نابود و از نو می‌ساخت (c.innerHTML='') → همهٔ تصویرها دوباره
     لود می‌شدند (فلیکرِ سیاه)، اسکرول به‌خاطرِ کوتاه‌شدنِ موقتیِ محتوا گیر می‌کرد و
     کاربر حس می‌کرد از نمایشِ زنده بیرون افتاده. حالا دو لیستِ موازی (نهایی/دیباگ)
     همیشه در DOM می‌مانند؛ سوئیچ فقط نمایش/مخفی است، هر حالت اسکرولِ خودش را به‌خاطر
     می‌سپارد، تصویرها هرگز دوباره لود نمی‌شوند و به‌روزرسانیِ زنده به هر دو لیست
     (حتی لیستِ مخفی) ادامه می‌دهد.
     ② «زوم می‌کنم میره پایین بالا»: content-visibility:auto روی تصویرها عناصرِ
     خارج از دید را در «اندازهٔ به‌خاطرسپاری‌شده» فریز می‌کرد → بعد از زوم بعضی
     تصویرها با عرضِ جدید و بعضی با اندازهٔ قدیمی → چیدمانِ دروغ → پرشِ اسکرول.
     حذف شد؛ loading=lazy می‌ماند و چون تصویرهایِ بالایِ دید همیشه اندازهٔ واقعی
     دارند، زومِ کانونی دقیق می‌ماند.
     v1.14.62: ① «زوم می‌کنم دستم بردارم میره پایین/بالا» — کامیتِ پینچ نقطهٔ
     زیرِ انگشت را بدونِ احتسابِ transformِ حینِ پینچ حساب می‌کرد → پرش در
     لحظهٔ رهاکردن؛ حالا نقطه با k=kz/startZ اصلاح و به انگشتِ باقی‌مانده
     کانونی می‌شود. ② «نمایش زنده کم کم لود کنه تا رم کمتری بخوره» — لودِ
     تدریجی با IntersectionObserver: فقط نوارِ اطرافِ دید در RAM می‌ماند؛
     صفحاتِ دور با قفلِ aspect-ratio به placeholder برمی‌گردند (چیدمان ثابت).
     v1.14.44: اسکرول داخل .rdrS (overflow:auto) — پنِ افقی/عمودیِ طبیعی WebView.
     دیباگ: data-ndbg از سمتِ اندروید تزریق می‌شود تا سوییچِ 🔍 در نمایشِ
     غیرِزنده هم تعدادِ صفحه‌های دیباگ را از اول بداند. -->
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>خواندن</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:#e8e6e1;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none;height:100%;overflow:hidden}.rdr{background:#000;direction:ltr;height:100%;display:flex;flex-direction:column}.rdr-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 10px;background:rgba(12,12,14,.97);border-bottom:1px solid #232326;z-index:2;flex:0 0 auto}.rdr-btn{background:#161619;color:#e8e6e1;border:1px solid #2a2a2e;border-radius:8px;padding:8px 12px;font-size:.95rem;cursor:pointer;font-family:inherit;min-width:40px;min-height:40px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.rdr-btn:active{background:#2a2a30}.rdr-btn.fs{background:#ff4a3d;border-color:#ff4a3d;color:#fff;font-weight:700}.rdr-title{flex:1 1 120px;color:#97948c;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;direction:rtl;min-width:0}.rdrS{flex:1 1 auto;overflow:auto;position:relative;background:#000;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y}.rdrC{margin:0 auto;max-width:min(100%,900px);width:100%}.rdrC .lg{width:100%}.rdrC .lg[hidden]{display:none}.rdrC img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;background:#0b0b0d}.rdr-progress{position:fixed;bottom:0;left:0;right:0;height:3px;background:#1a1a1c;z-index:3}.rdrB{height:100%;width:0;background:linear-gradient(90deg,#ff4a3d,#ff8a5e)}.zlv{color:#97948c;font-size:.8rem;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}.ph{width:100%;direction:rtl;aspect-ratio:2/3;background:linear-gradient(100deg,#101012 40%,#17171a 50%,#101012 60%);background-size:200% 100%;animation:shph 1.6s infinite;border-radius:10px;margin:0 0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#5d5b55;font-size:.8rem}@keyframes shph{0%{background-position:120% 0}100%{background-position:-80% 0}}.sp{width:26px;height:26px;border-radius:50%;border:3px solid #26262a;border-top-color:#ff4a3d;animation:spinph 1s linear infinite}@keyframes spinph{to{transform:rotate(360deg)}}@media (max-width:480px){.rdr-bar{gap:4px;padding:6px 8px}.rdr-btn{padding:7px 10px;font-size:.9rem;min-width:36px}.rdr-title{font-size:.72rem;order:10;flex:1 1 100%;text-align:center}}</style>
</head>
<body>
<div class="rdr" id="manga_rdr" data-zoom="1">
  <div class="rdr-bar">
    <button type="button" class="rdr-btn" data-act="close" title="بستن">✕</button>
    <div class="rdr-title">__TITLE__</div>
    <button type="button" class="rdr-btn" data-act="zoom-out" title="دور">−</button>
    <span class="zlv">100%</span>
    <button type="button" class="rdr-btn" data-act="zoom-in" title="نزدیک">+</button>
    <button type="button" class="rdr-btn" data-act="zoom-fit" title="پهنای صفحه">پهنا</button>
    <button type="button" class="rdr-btn fs" data-act="fs" title="فول‌اسکرین">⛶</button>
    <button type="button" class="rdr-btn" data-act="dbg" hidden title="سوئیچ دیباگ زنده">🔍 دیباگ</button>
  </div>
  <div class="rdrS"><div class="rdrC">__IMGS__</div></div>
  <div class="rdr-progress"><div class="rdrB"></div></div>
</div>
<script>
(function(){
  const root = document.getElementById('manga_rdr');
  if (!root) return;
  const s = root.querySelector('.rdrS');
  const c = root.querySelector('.rdrC');
  const bar = root.querySelector('.zlv');
  const prog = root.querySelector('.rdrB');
  if (!c || !s) return;
  let z = 1;
  const MIN = 0.5, MAX = 4;
  const baseWidth = () => Math.max(200, Math.min(900, s.clientWidth || window.innerWidth || 360));
  // v1.14.44: زومِ کانونی نسبت به خودِ اسکرولر — نقطهٔ زیرِ انگشت ثابت می‌ماند
  const applyZoom = (nz, cx, cy) => {
    nz = Math.min(MAX, Math.max(MIN, +nz || 1));
    const rc = s.getBoundingClientRect();
    const sx = (typeof cx === 'number') ? (cx - rc.left) : (rc.width / 2);
    const sy = (typeof cy === 'number') ? (cy - rc.top) : (rc.height / 2);
    const fx = (s.scrollLeft + sx) / Math.max(0.01, z);
    const fy = (s.scrollTop + sy) / Math.max(0.01, z);
    z = nz;
    c.style.maxWidth = 'none';
    c.style.width = Math.round(baseWidth() * z) + 'px';
    s.scrollLeft = Math.max(0, fx * z - sx);
    s.scrollTop = Math.max(0, fy * z - sy);
    if (bar) bar.textContent = Math.round(z * 100) + '%';
    root.dataset.zoom = String(z);
  };
  const setZoom = (nz) => applyZoom(nz);
  const zoomBy = (f, cx, cy) => applyZoom(z * f, cx, cy);
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn || !root.contains(btn)) return;
    e.preventDefault();
    const act = btn.getAttribute('data-act');
    if (act === 'close') {
      try {
        const isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (isFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } catch (err) {}
      try { window.close(); } catch (err) {}
      try { if (history.length > 1) history.back(); } catch (err) {}
      return;
    }
    if (act === 'dbg') {
      dbgMode = !dbgMode;
      btn.textContent = dbgMode ? '\ud83d\udcd6 نهایی' : '🔍 دیباگ';
      btn.classList.toggle('fs', dbgMode);
      applyMode();
      return;
    }
    else if (act === 'zoom-in') zoomBy(1.25);
    else if (act === 'zoom-out') zoomBy(0.8);
    else if (act === 'zoom-fit') setZoom(1);
    else if (act === 'fs') {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement
                || document.mozFullScreenElement || document.msFullscreenElement;
      if (isFs) {
        (document.exitFullscreen || document.webkitExitFullscreen
         || document.mozCancelFullScreen || document.msExitFullscreen).call(document);
      } else {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen
                 || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) {
          try { req.call(el); } catch (err) {
            try { req.call(root); } catch (err2) {}
          }
        }
      }
    }
  });
  window.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
  }, { passive: false });
  window.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if (z > 1.3) setZoom(1);
    else zoomBy(2.2, e.clientX, e.clientY);
  });
  // v1.14.44: پنِ تک‌انگشتی به WebView سپرده شد — درگ روی .rdrS (overflow:auto)
  // به‌طور طبیعی افقی/عمودی با مومنتوم اسکرول می‌کند. JS فقط پینچ را می‌گیرد.
  // v1.14.59 — ضدِ لگِ زوم (مشکلِ «عکسِ دوم زوم می‌کنم لگ میزنه»): زومِ
  // چیدمانی (تغییرِ width) در «هر» فریمِ پینچ، همهٔ تصویرهایِ عظیمِ داخلِ
  // DOM را دوباره چیدمان+رستریزی می‌کند (هر صفحه ۲۸MP!) — با چند صفحه
  // بودجۀ رستریWebView تمام می‌شود = لگ. حالا در حینِ پینچ فقط transformِ
  // GPU (بدونِ چیدمان) با نرخِ RAF اعمال می‌شود و در «پایانِ» پینچ یک‌بار
  // چیدمانِ نهایی commit می‌شود (برندگیِ تیز مثل قبل).
  let pinch = null, pinchRaf = 0, pinchEvt = null;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });
  const clampZ = (nz) => Math.min(MAX, Math.max(MIN, +nz || 1));
  // v1.14.62 — فیکسِ «زوم می‌کنم دستم را بردارم می‌پرد بالا/پایین»: کامیتِ
  // قبلی نقطهٔ زیرِ انگشت را (scroll+mid)/z می‌گرفت؛ ولی در حینِ پینچ چیدمان
  // هنوز در startZ بود و فقط transformِ GPU با k=kz/startZ بزرگ‌نمایی می‌کرد —
  // یعنی نقطهٔ واقعیِ چیدمانیِ زیرِ انگشت (scroll+mid)/k بود، نه ÷z → بعد از
  // رهاکردنِ انگشت نقطهٔ اشتباهی کانون می‌شد = پرش. حالا نقطه با k اصلاح
  // می‌شود و اگر یک انگشت باقی مانده باشد، کانون = همان انگشتِ باقی‌مانده
  // (نه وسطِ دو انگشت) تا پنِ تک‌انگشتیِ بعدش بدونِ جهش ادامه یابد.
  // v1.14.63 — فیکسِ «زوم کنم کمی میره چپ یا بالا»: اسکرول باید «با
  // ترنسفورمِ فعال» خوانده شود! پاک‌کردنِ transform، سرریزِ اسکرولی را به
  // چیدمانِ بدونِ زوم برمی‌گرداند و مرورگر همان لحظه scrollLeft/Top را به
  // مرزِ جدید گیره می‌کند (افقیِ صفحهٔ هم‌عرضِ صفحه: همیشه 0!) → مقدارِ
  // خوانده‌شده خراب بود و کانونِ کامیت به هم می‌ریخت = سرخوردن در رهاکردن.
  const commitPinch = (anchor) => {
    if (pinchRaf) { cancelAnimationFrame(pinchRaf); pinchRaf = 0; }
    if (!pinch) return;
    const kz = pinch.curZ || pinch.startZ;
    const lm = anchor || pinch.lastMid;
    const k = kz / Math.max(0.01, pinch.startZ);
    const slT = s.scrollLeft, stT = s.scrollTop;  // با ترنسفورمِ فعال
    const noMove = (pinch.curZ == null) || (kz === pinch.startZ && !pinch.lastMid);
    pinch = null;
    c.style.transform = '';
    c.style.transformOrigin = '';
    c.style.willChange = '';
    if (lm) {
      const rc = s.getBoundingClientRect();
      const sx = lm.x - rc.left, sy = lm.y - rc.top;
      // نقطهٔ چیدمانیِ زیرِ lm با احتسابِ transformِ فعلی (k) — واحد: چیدمانِ
      // startZ. چیدمانِ جدید W1=baseWidth*kz = W0*k است → اسکرولِ درست =
      // fx*k − sx (نه fx*kz − sx! fx*kz فقط وقتی startZ=1 درست بود؛ در
      // پینچِ دوم به بعد چیدمانِ قبلی baseWidth*startZ بود → پرشِ
      // «دستم را بردارم میره پایین/بالا»). fx*k = fx*kz/startZ.
      const fx = (slT + sx) / k;
      const fy = (stT + sy) / k;
      z = kz;
      c.style.maxWidth = 'none';
      c.style.width = Math.round(baseWidth() * kz) + 'px';
      s.scrollLeft = Math.max(0, fx * k - sx);
      s.scrollTop = Math.max(0, fy * k - sy);
      if (bar) bar.textContent = Math.round(kz * 100) + '%';
      root.dataset.zoom = String(z);
    } else if (noMove) {
      // پینچِ بدونِ هیچ حرکتی (تپِ دومنگشتی): هیچ چیز نباید جابه‌جا شود
      if (bar) bar.textContent = Math.round(kz * 100) + '%';
    } else {
      applyZoom(kz);
    }
  };
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      // اگر پینچِ قبلی وسطِ کار بود اول commit کن
      if (pinch) commitPinch();
      pinch = {
        startDist: dist(e.touches[0], e.touches[1]),
        startZ: z, curZ: z,
        F: null,        // نقطهٔ محتواییِ زیرِ وسطِ انگشت‌ها (مختصاتِ چیدمان)
        lastMid: null
      };
      c.style.willChange = 'transform';
      c.style.transformOrigin = '0 0';
    }
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      pinchEvt = e;
      if (!pinchRaf) {
        pinchRaf = requestAnimationFrame(() => {
          pinchRaf = 0;
          if (!pinch || !pinchEvt) return;
          const ev = pinchEvt; pinchEvt = null;
          const d = dist(ev.touches[0], ev.touches[1]);
          const m = mid(ev.touches[0], ev.touches[1]);
          const kz = clampZ(pinch.startZ * (d / Math.max(1, pinch.startDist)));
          // k نسبت به «چیدمان» است که هنوز در startZ است
          const k = kz / Math.max(0.01, pinch.startZ);
          // تبدیلِ GPU: فقط رستریِ لایه — هیچ چیدمانِ دوباره
          c.style.transform = 'scale(' + k + ')';
          const rc = s.getBoundingClientRect();
          const mx = m.x - rc.left, my = m.y - rc.top;
          // v1.14.61 — فیکسِ «زوم می‌کنم میره پایین»: قبلاً اسکرول با
          // فرمولِ بازگشتیِ (scroll+mid)*k−mid روی مقدارِ «قبلیِ» خودش
          // اعمال می‌شد؛ هر فریم در k>1 ضربِ دوباره می‌شد → اسکرول به‌صورت
          // تصاعدی به پایین می‌رفت. حالا «مطلق»: نقطهٔ محتواییِ F یک‌بار در
          // شروعِ پینچ قفل می‌شود و اسکرول هر فریم = F*k − midِ فعلی —
          // بدونِ پس‌خور؛ حرکتِ انگشت‌ها هم پنِ طبیعی می‌دهد.
          if (!pinch.F) pinch.F = { x: s.scrollLeft + mx, y: s.scrollTop + my };
          // v1.14.62: اسکرول ممکن است به مرزِ چیدمان بخورد (ناحیهٔ دیده‌شدهٔ
          // transform بزرگ‌تر از چیدمان است) — اگر خورد، کانون را به وضعیتِ
          // واقعی قفل کن تا فریم‌های بعدی از همان‌جا ادامه دهند (بدونِ جهش)
          const mX = s.scrollWidth - s.clientWidth, mY = s.scrollHeight - s.clientHeight;
          const wX = pinch.F.x * k - mx, wY = pinch.F.y * k - my;
          const tX = Math.max(0, Math.min(mX, wX));
          const tY = Math.max(0, Math.min(mY, wY));
          s.scrollLeft = tX; s.scrollTop = tY;
          if (tX !== wX) pinch.F.x = (tX + mx) / k;
          if (tY !== wY) pinch.F.y = (tY + my) / k;
          pinch.curZ = kz;
          pinch.lastMid = { x: m.x, y: m.y };
          if (bar) bar.textContent = Math.round(kz * 100) + '%';
        });
      }
    }
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    // v1.14.62: اگر یک انگشت باقی مانده، همان انگشت کانونِ کامیت شود
    if (pinch && e.touches.length < 2)
      commitPinch(e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null);
  });
  document.addEventListener('touchcancel', () => commitPinch());
  const updateProgress = () => {
    if (!prog) return;
    const m = s.scrollHeight - s.clientHeight;
    prog.style.width = (m > 0 ? Math.min(100, Math.max(0, s.scrollTop / m * 100)) : 0) + '%';
  };
  s.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', () => { if (z !== 1) applyZoom(z); updateProgress(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      try {
        const isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (isFs) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      } catch (err) {}
      try { window.close(); } catch (err) {}
    } else if (e.key === '+' || e.key === '=') zoomBy(1.15);
    else if (e.key === '-' || e.key === '_') zoomBy(0.87);
    else if (e.key === '0') setZoom(1);
    else if (e.key === 'f' || e.key === 'F') {
      const btn = root.querySelector('[data-act="fs"]');
      if (btn) btn.click();
    }
  });
  // ——— نمایش زنده داخل خواننده + سوئیچ دیباگ (v1.14.58: دو لیستِ موازی) ———
  // v1.14.45: دیباگ هم زنده. v1.14.58: لیستِ نهایی و لیستِ دیباگ هر دو همیشه در
  // DOM می‌مانند (لیستِ غیرفعال فقط مخفی است) → سوئیچ هیچ‌چیز را نابود/بازسازی
  // نمی‌کند، تصویرها دوباره لود نمی‌شوند، اسکرولِ هر حالت جدا به‌خاطر سپرده
  // می‌شود و به‌روزرسانیِ زنده به لیستِ مخفی هم اعمال می‌شود = «از نمایش زنده
  // در نمی‌افتد».
  let dbgMode = false, arrived = 0, total = 0, ndbg = 0;
  let isLive = false, sessionDone = false;
  // ——— دو لیستِ موازی: lgF = نهایی، lgD = دیباگ ———
  // تصویرها/اسلات‌های استاتیکِ تزریقیِ اندروید مستقیماً داخل .rdrC هستند →
  // همه به لیستِ نهایی منتقل می‌شوند و لیستِ دیباگ کنارشان ساخته می‌شود.
  const lgF = document.createElement('div');
  lgF.className = 'lg lgF';
  const lgD = document.createElement('div');
  lgD.className = 'lg lgD';
  lgD.hidden = true;
  while (c.firstChild) lgF.appendChild(c.firstChild);
  c.appendChild(lgF);
  c.appendChild(lgD);
  // ——— v1.14.62: لودِ تدریجی برای رمِ کمتر («نمایش زنده کم کم لود کنه») ———
  // تصویرها تا ۲۸ مگاپیکسل‌اند؛ هر کدام ~۱۱۰MB بیت‌مپِ دیکودشده می‌خواهد و
  // WebView با چند صفحه خفه می‌شود. حالا فقط نوارِ اطرافِ دید (±۲.۲ برابرِ
  // ارتفاعِ دید) نگه داشته می‌شود؛ صفحاتِ دور به placeholderِ ۱px برمی‌گردند
  // (اول aspect-ratio از اندازهٔ واقعی قفل می‌شود تا چیدمان و اسکرول ذره‌ای
  // تکان نخورد) و با نزدیک‌شدن دوباره لود می‌شوند = لودِ «کم‌کم». لیستِ مخفی
  // (display:none) همیشه کاملاً تخلیه است و هنگام سوئیچ از نو لود می‌شود.
  const PH1 = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  const mgIO = ('IntersectionObserver' in window) ? new IntersectionObserver((es) => {
    for (const en of es) {
      const im = en.target;
      if (en.isIntersecting) {
        const r = im.dataset.src || '';
        if (r && im.getAttribute('src') !== r) im.setAttribute('src', r);
      } else if (im.naturalWidth > 1 && im.naturalHeight > 1) {
        // >1: placeholderِ ۱px هرگز aspect-ratio را با ۱/۱ بازنویسی نکند
        try { im.style.aspectRatio = im.naturalWidth + '/' + im.naturalHeight; } catch (err) {}
        if (im.getAttribute('src') !== PH1) im.setAttribute('src', PH1);
      }
    }
  }, { root: s, rootMargin: '220% 0px 220% 0px' }) : null;
  const mgImg = (im) => {
    if (!mgIO || !im || im.__mgd) return;
    im.__mgd = 1;
    if (!im.dataset.src) im.dataset.src = im.getAttribute('src') || '';
    try { mgIO.observe(im); } catch (err) {}
  };
  const mkImg = (i, dbg) => {
    const im = document.createElement('img');
    im.src = (dbg ? 'd/' : 'i/') + i;
    im.dataset.src = im.src;
    im.loading = 'lazy';
    im.decoding = 'async';
    im.alt = '';
    im.draggable = false;
    mgImg(im);
    return im;
  };
  arrived = lgF.querySelectorAll('img').length;
  // v1.14.62: تصویرهایِ تزریقیِ استاتیکِ اندروید هم تحتِ مدیریتِ لودِ تدریجی
  try { lgF.querySelectorAll('img').forEach(mgImg); } catch (err) {}
  const scrollMem = { final: 0, dbg: 0 };
  try {
    const tb0 = root.querySelector('[data-act="dbg"]');
    ndbg = tb0 ? (parseInt(tb0.getAttribute('data-ndbg') || '0', 10) || 0) : 0;
  } catch (err) { ndbg = 0; }
  const mkPh = () => {
    const d = document.createElement('div');
    d.className = 'ph';
    d.innerHTML = '<span class="sp"></span>در حال ترجمه…';
    return d;
  };
  // تعدادِ اسلاتِ «در حال ترجمه» که در اولین رندر تزریق شده — بعد از اولین
  // __mangaLive این عدد با total جایگزین می‌شود (v1.14.45 هم همین بود)
  let staticPh = lgF.querySelectorAll('.ph').length;
  function renderFinal() {
    let want = arrived + (total > 0 ? Math.max(0, total - arrived) : staticPh);
    if (total > 0) want = Math.max(total, arrived);
    while (lgF.children.length < want) lgF.appendChild(mkPh());
    // v1.14.58: اسلاتِ اضافه جمع شود — اگر اندروید بیشتر از totalِ واقعی اسلات
    // تزریق کرده باشد، placeholderِ سرگردانِ «در حال ترجمه…» برای همیشه آخرِ
    // لیست می‌ماند (تصویرها هرگز حذف نمی‌شوند؛ فقط placeholderِ انتهایی)
    if (total > 0) {
      while (lgF.children.length > want &&
             lgF.children[lgF.children.length - 1].className === 'ph') {
        lgF.removeChild(lgF.lastChild);
      }
    }
    for (let i = 0; i < arrived && i < lgF.children.length; i++) {
      const el = lgF.children[i];
      if (el && el.tagName !== 'IMG') lgF.replaceChild(mkImg(i, false), el);
    }
  }
  function renderDbg() {
    let w = ndbg;
    if (isLive && !sessionDone) w += 1; // اسلاتِ زندهٔ آخرِ لیست
    while (lgD.children.length < w) lgD.appendChild(mkPh());
    // با پایانِ نشست، اسلاتِ اضافه فقط وقتی جمع می‌شود که واقعاً placeholder است
    if (!isLive || sessionDone) {
      while (lgD.children.length > ndbg &&
             lgD.children[lgD.children.length - 1].className === 'ph') {
        lgD.removeChild(lgD.lastChild);
      }
    }
    for (let i = 0; i < ndbg && i < lgD.children.length; i++) {
      const el = lgD.children[i];
      if (el && el.tagName !== 'IMG') lgD.replaceChild(mkImg(i, true), el);
    }
  }
  function renderLive() {
    renderFinal();
    renderDbg();
    updateProgress();
  }
  function applyMode() {
    // v1.14.58: فقط نمایش/مخفی + بازیابیِ اسکرولِ همان حالت — بدونِ بازسازی
    scrollMem[dbgMode ? 'final' : 'dbg'] = s.scrollTop; // اسکرولِ حالتِ قبلی
    lgF.hidden = dbgMode;
    lgD.hidden = !dbgMode;
    s.scrollTop = Math.min(scrollMem[dbgMode ? 'dbg' : 'final'],
                           Math.max(0, s.scrollHeight - s.clientHeight));
    updateProgress();
  }
  window.__mangaLive = function(n, tot, nd, fin) {
    try {
      isLive = true;
      if (typeof tot === 'number' && tot > 0) {
        total = tot;
        staticPh = 0; // از این‌جا به بعد total مرجع است
      }
      if (typeof nd === 'number' && nd > 0) {
        ndbg = nd;
        const tb = root.querySelector('[data-act="dbg"]');
        if (tb) {
          tb.hidden = false;
          tb.style.background = '#b3261e';
          tb.style.borderColor = '#d64545';
          tb.style.color = '#fff';
          tb.style.fontWeight = '700';
        }
      }
      // arrived در هر دو حالت به‌روز می‌شود (v1.14.45) — لیستِ نهایی حتی وقتی
      // مخفی است پر می‌شود تا برگشت به «نهایی» هیچ صفحه‌ای را از دست ندهد
      arrived = Math.max(arrived, n | 0);
      if (fin === true) sessionDone = true;
      renderLive();
    } catch (err) {}
  };
  // v1.14.160 — پیشنمایشِ ۱۵تایی: موتور بعد از هر بستهِ ترجمه، همان اسلات را
  // دوباره رندر میکند و زمانش را در mtimes.txt مینویسد؛ اینجا فقط اسلاتِ
  // عوضشده دوباره لود میشود (بدون پرش اسکرول و بازسازی کل).
  const mgMtimes = {};
  let mgMtimesBusy = false;
  function pollMtimes() {
    if (!isLive || sessionDone || mgMtimesBusy || arrived <= 0) return;
    mgMtimesBusy = true;
    fetch('mtimes.txt?r=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.ok ? r.text() : ''; })
      .then(function(t) {
        mgMtimesBusy = false;
        if (!t) return;
        const lines = t.split('\n');
        for (let k = 0; k < lines.length; k++) {
          const p = lines[k].trim().split(/\s+/);
          if (p.length < 2) continue;
          const slot = parseInt(p[0], 10), mt = p[1];
          if (!(slot >= 1 && slot <= arrived)) continue;
          if (mgMtimes[slot] === mt) continue;
          mgMtimes[slot] = mt;
          const el = lgF.children[slot - 1];
          if (el && el.tagName === 'IMG') {
            el.dataset.src = 'i/' + (slot - 1) + '?r=' + Date.now();
            if (el.getAttribute('src') !== PH1)
              el.setAttribute('src', el.dataset.src);
          }
        }
      })
      .catch(function() { mgMtimesBusy = false; });
  }
  setInterval(pollMtimes, 2500);

  if (arrived > 0 || staticPh > 0) renderLive();
  updateProgress();
})();
</script>
</body>
</html>
