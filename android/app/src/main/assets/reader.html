<!DOCTYPE html>
<!--
  نمایشگرِ درون‌برنامه‌ای: نمایشِ زنده + حالتِ دیباگ (دو لیستِ موازی همیشه
  در DOM می‌مانند؛ سوئیچ فقط نمایش/مخفی است)، زومِ کانونیِ پینچ، اسکرولِ
  طبیعیِ WebView و لودِ تدریجی (IntersectionObserver) برای رمِ کمتر.
-->
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>خواندن</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:#e8e6e1;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none;height:100%;overflow:hidden}.rdr{background:#000;direction:ltr;height:100%;display:flex;flex-direction:column}.rdr-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 10px;background:rgba(12,12,14,.97);border-bottom:1px solid #232326;z-index:2;flex:0 0 auto}.rdr-btn{background:#161619;color:#e8e6e1;border:1px solid #2a2a2e;border-radius:8px;padding:8px 12px;font-size:.95rem;cursor:pointer;font-family:inherit;min-width:40px;min-height:40px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.rdr-btn:active{background:#2a2a30}.rdr-btn.fs{background:#ff4a3d;border-color:#ff4a3d;color:#fff;font-weight:700}.rdr-title{flex:1 1 120px;color:#97948c;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;direction:rtl;min-width:0}.rdrS{flex:1 1 auto;overflow:auto;position:relative;background:#000;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y}.rdrC{margin:0 auto;max-width:min(100%,900px);width:100%}.rdrC .lg{width:100%;position:relative}.rdrC .lg[hidden]{display:none}.rdrC img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;background:#0b0b0d}.dslot{position:relative;width:100%}.dslot>svg.dovl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:block}.rdrC.no-det .g-det{display:none}.rdrC.no-pdet .g-pdet{display:none}.rdrC.no-rec .g-rec{display:none}.rdr-progress{position:fixed;bottom:0;left:0;right:0;height:3px;background:#1a1a1c;z-index:3}.rdrB{height:100%;width:0;background:linear-gradient(90deg,#ff4a3d,#ff8a5e)}.zlv{color:#97948c;font-size:.8rem;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}.ph{width:100%;direction:rtl;aspect-ratio:2/3;background:linear-gradient(100deg,#101012 40%,#17171a 50%,#101012 60%);background-size:200% 100%;animation:shph 1.6s infinite;border-radius:10px;margin:0 0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#5d5b55;font-size:.8rem}@keyframes shph{0%{background-position:120% 0}100%{background-position:-80% 0}}.sp{width:26px;height:26px;border-radius:50%;border:3px solid #26262a;border-top-color:#ff4a3d;animation:spinph 1s linear infinite}@keyframes spinph{to{transform:rotate(360deg)}}@media (max-width:480px){.rdr-bar{gap:4px;padding:6px 8px}.rdr-btn{padding:7px 10px;font-size:.9rem;min-width:36px}.rdr-title{font-size:.72rem;order:10;flex:1 1 100%;text-align:center}}#fab{position:fixed;z-index:60;left:18px;bottom:26px;width:60px;height:60px;border-radius:50%;background:#161619;border:2px solid #ff4a3d;color:#fff;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 6px 20px rgba(0,0,0,.6);-webkit-tap-highlight-color:transparent;user-select:none}#fab:active{transform:scale(.93)}.fbtn{position:fixed;z-index:59;width:58px;height:58px;border-radius:50%;background:#1c1c20;border:2px solid #2e2e33;color:#e8e6e1;font-family:inherit;font-size:.6rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.55);opacity:0;pointer-events:none;transform:scale(.3);transition:opacity .15s ease-out,transform .15s ease-out,left .15s linear,top .15s linear}.fbtn.show{opacity:1;pointer-events:auto;transform:scale(1)}.fbtn .ic{font-size:1.02rem;line-height:1.1}.fbtn.on{border-color:#3a8bff;background:#101f38;color:#fff}.fbtn.fdbg.on{border-color:#ff4a3d;background:#2c1210}.rdr-btn.hot{background:#ff4a3d;border-color:#ff4a3d;color:#fff;font-weight:700}#cmp{position:fixed;inset:0;z-index:70;background:#000;display:none;flex-direction:column}#cmp.show{display:flex}.cmp-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0c0c0e;border-bottom:1px solid #232326;flex:0 0 auto;direction:rtl}.cmp-t{flex:1;color:#e8e6e1;font-size:.85rem;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.cbtn{background:#161619;color:#e8e6e1;border:1px solid #2a2a2e;border-radius:8px;min-width:40px;min-height:40px;font-size:1.02rem;cursor:pointer;flex:none;font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.cbtn:active{background:#2a2a30}.cmp-stage{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;background:#0b0b0d}.cmp-stage img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;background:#0b0b0d}#cmpBWrap{position:absolute;inset:0;overflow:hidden;clip-path:inset(0 0 0 50%);-webkit-clip-path:inset(0 0 0 50%)}#cmpDiv{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 10px rgba(0,0,0,.75);z-index:3;pointer-events:none}#cmpDiv .cmp-h{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;color:#151517;display:flex;align-items:center;justify-content:center;font-size:1.05rem;box-shadow:0 2px 12px rgba(0,0,0,.6)}.cmp-lab{position:absolute;top:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:3px 10px;font-size:.78rem;z-index:3;pointer-events:none}.cmp-lab.b{right:12px}.cmp-lab.a{left:12px}</style>
</head>
<body data-ndbg="0">
<div class="rdr" id="manga_rdr" data-zoom="1">
  <div class="rdr-bar">
    <button type="button" class="rdr-btn" data-act="close" title="بستن">✕</button>
    <div class="rdr-title">__TITLE__</div>
    <button type="button" class="rdr-btn" id="mtoggle" style="display:none" title="حالتِ دیباگ/نهایی">دیباگ</button>
    <button type="button" class="rdr-btn" data-act="zoom-out" title="دور">−</button>
    <span class="zlv">100%</span>
    <button type="button" class="rdr-btn" data-act="zoom-in" title="نزدیک">+</button>
    <button type="button" class="rdr-btn" data-act="zoom-fit" title="پهنای صفحه">پهنا</button>
    <button type="button" class="rdr-btn fs" data-act="fs" title="فول‌اسکرین">⛶</button>
    </div>
  <div class="rdrS"><div class="rdrC">__IMGS__</div></div>
  <div class="rdr-progress"><div class="rdrB"></div></div>
</div>
<button type="button" id="fab" aria-label="منو" style="display:none">منو</button>
<div id="cmp">
  <div class="cmp-bar">
    <button type="button" class="cbtn" id="cmpX" title="بستن">✕</button>
    <div class="cmp-t" id="cmpT">صفحهٔ ۱</div>
    <button type="button" class="cbtn" id="cmpPrev" title="صفحهٔ قبل">‹</button>
    <button type="button" class="cbtn" id="cmpNext" title="صفحهٔ بعد">›</button>
  </div>
  <div class="cmp-stage" id="cmpStage">
    <img id="cmpA" alt="بعد — ترجمه‌شده" draggable="false">
    <div id="cmpBWrap"><img id="cmpB" alt="قبل — اصلی" draggable="false"></div>
    <div id="cmpDiv"><span class="cmp-h">⇔</span></div>
    <span class="cmp-lab b">قبل</span>
    <span class="cmp-lab a">بعد</span>
  </div>
</div>
<script>
(function(){
  const root = document.getElementById('manga_rdr');
  if (!root) return;
  const s = root.querySelector('.rdrS');
  const c = root.querySelector('.rdrC');
  const bar = root.querySelector('.zlv');
  const prog = root.querySelector('.rdrB');
  // ——— کشِ «بارِ اول»: عکسها فقط یک بار از سرورِ محلی/وب
  // میآیند؛ blob در حافظهٔ جلسه + IndexedDB میماند (گوشی/وب) —
  // برگشتِ اسکرول، سوئیچِ دیباگ/نهایی و حتی بستن و بازکردنِ
  // دوبارهٔ همان فصل، دیگر هیچ لودِ دوبارهای ندارد.
  const idbOK = (() => { try { return !!window.indexedDB; } catch (err) { return false; } })();
  let _db = null;
  const idb = () => {
    if (!idbOK) return Promise.resolve(null);
    if (_db) return Promise.resolve(_db);
    return new Promise((res) => {
      try {
        const q = indexedDB.open('mangaRdrCache', 1);
        q.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('imgs')) d.createObjectStore('imgs');
          if (!d.objectStoreNames.contains('ovls')) d.createObjectStore('ovls');
        };
        q.onsuccess = (e) => { _db = e.target.result; res(_db); };
        q.onerror = () => res(null);
        q.onblocked = () => res(null);
      } catch (err) { res(null); }
    });
  };
  const idbGet = (st, k) => idb().then((d) => {
    if (!d) return undefined;
    return new Promise((res) => {
      try {
        const t = d.transaction(st, 'readonly').objectStore(st).get(k);
        t.onsuccess = () => res(t.result);
        t.onerror = () => res(undefined);
      } catch (err) { res(undefined); }
    });
  });
  let _pruneBusy = false;
  const idbPut = (st, k, v) => idb().then((d) => {
    if (!d) return;
    try {
      const tx = d.transaction(st, 'readwrite');
      tx.objectStore(st).put(v, k);
      tx.oncomplete = () => { if (st === 'imgs' && !_pruneBusy && Math.random() < 0.1) pruneOld(); };
    } catch (err) {}
  });
  const pruneOld = () => {
    _pruneBusy = true;
    idb().then((d) => {
      if (!d) { _pruneBusy = false; return; }
      try {
        const rq = d.transaction('imgs', 'readonly').objectStore('imgs').count();
        rq.onsuccess = () => {
          const n = rq.result;
          if (n < 1400) { _pruneBusy = false; return; }
          const cur = d.transaction('imgs', 'readonly').objectStore('imgs').openCursor();
          const items = [];
          cur.onsuccess = (e) => {
            const c2 = e.target.result;
            if (c2) { items.push([c2.key, (c2.value && c2.value.t) || 0]); c2.continue(); }
            else {
              items.sort((a, b) => a[1] - b[1]);
              try {
                const tx2 = d.transaction('imgs', 'readwrite');
                items.slice(0, Math.max(0, n - 1000)).forEach((it) => {
                  tx2.objectStore('imgs').delete(it[0]);
                });
              } catch (err) {}
              _pruneBusy = false;
            }
          };
        };
        rq.onerror = () => { _pruneBusy = false; };
      } catch (err) { _pruneBusy = false; }
    });
  };
  const abs = (u) => { try { return new URL(u, location.href).href; } catch (err) { return u; } };
  // توکنِ ران (data-run از MainActivity): کلیدهای کش با آن پیشوند
  // میگیرند — رانِ جدید = کلیدِ جدید = عکسِ رانِ قبل از کش نمیآید
  const RUN = (document.body.getAttribute('data-run') || '').replace(/[^A-Za-z0-9_-]/g, '');
  const ck = (u) => RUN + '|' + u;
  const blobMem = new Map(), blobFail = new Map();
  const imgGet = (u, fresh) => {
    if (!fresh && blobMem.has(u)) return Promise.resolve(blobMem.get(u));
    if (!fresh && blobFail.has(u) && (Date.now() - blobFail.get(u)) < 8000)
      return Promise.reject(0);
    if (fresh) blobFail.delete(u);
    const pre = (!fresh)
      ? idbGet('imgs', ck(u)).then((h) => (h && h.b) ? h.b : null)
      : Promise.resolve(null);
    return pre.then((b) => {
      if (b) { const u2 = URL.createObjectURL(b); blobMem.set(u, u2); return u2; }
      return fetch(u + (fresh ? ('?r=' + Date.now()) : ''), fresh ? { cache: 'no-store' } : {})
        .then((r) => { if (!r.ok) throw 0; return r.blob(); })
        .then((b2) => {
          idbPut('imgs', ck(u), { b: b2, t: Date.now() });
          const u3 = URL.createObjectURL(b2);
          blobMem.set(u, u3);
          return u3;
        })
        .catch((err) => { blobFail.set(u, Date.now()); throw err; });
    });
  };
  const ovlMem = new Map();
  const ovlGet = (u, fresh) => {
    if (!fresh && ovlMem.has(u)) return Promise.resolve(ovlMem.get(u));
    const pre = (!fresh)
      ? idbGet('ovls', ck(u)).then((h) => (h && h.j) ? h.j : null)
      : Promise.resolve(null);
    return pre.then((j) => {
      if (j) { ovlMem.set(u, j); return j; }
      return fetch(u + (fresh ? ('?r=' + Date.now()) : ''), fresh ? { cache: 'no-store' } : {})
        .then((r) => { if (!r.ok) throw 0; return r.json(); })
        .then((j2) => { ovlMem.set(u, j2); idbPut('ovls', ck(u), { j: j2, t: Date.now() }); return j2; });
    });
  };
  if (!c || !s) return;
  let z = 1;
  const MIN = 0.5, MAX = 4;
  const baseWidth = () => Math.max(200, Math.min(900, s.clientWidth || window.innerWidth || 360));
  // زومِ کانونی نسبت به خودِ اسکرولر — نقطهٔ زیرِ انگشت ثابت می‌ماند
  const applyZoom = (nz, cx, cy) => {
    nz = Math.min(MAX, Math.max(MIN, +nz || 1));
    const rc = s.getBoundingClientRect();
    const sx = (typeof cx === 'number') ? (cx - rc.left) : (rc.width / 2);
    const sy = (typeof cy === 'number') ? (cy - rc.top) : (rc.height / 2);
    const fx = (s.scrollLeft + sx) / Math.max(0.01, z);
    const fy = (s.scrollTop + sy) / Math.max(0.01, z);
    z = nz;
    c.style.maxWidth = 'none';
    c.style.width = Math.round(baseWidth() * z) + 'px';
    s.scrollLeft = Math.max(0, fx * z - sx);
    s.scrollTop = Math.max(0, fy * z - sy);
    if (bar) bar.textContent = Math.round(z * 100) + '%';
    root.dataset.zoom = String(z);
  };
  const setZoom = (nz) => applyZoom(nz);
  const zoomBy = (f, cx, cy) => applyZoom(z * f, cx, cy);
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn || !root.contains(btn)) return;
    e.preventDefault();
    const act = btn.getAttribute('data-act');
    if (act === 'close') {
      try {
        const isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (isFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } catch (err) {}
      try { window.close(); } catch (err) {}
      try { if (history.length > 1) history.back(); } catch (err) {}
      return;
    }
    else if (act === 'zoom-in') zoomBy(1.25);
    else if (act === 'zoom-out') zoomBy(0.8);
    else if (act === 'zoom-fit') setZoom(1);
    else if (act === 'fs') {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement
                || document.mozFullScreenElement || document.msFullscreenElement;
      if (isFs) {
        (document.exitFullscreen || document.webkitExitFullscreen
         || document.mozCancelFullScreen || document.msExitFullscreen).call(document);
      } else {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen
                 || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) {
          try { req.call(el); } catch (err) {
            try { req.call(root); } catch (err2) {}
          }
        }
      }
    }
  });
  window.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
  }, { passive: false });
  window.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if (z > 1.3) setZoom(1);
    else zoomBy(2.2, e.clientX, e.clientY);
  });
  // پنِ تک‌انگشتی به WebView سپرده شد — درگ روی .rdrS (overflow:auto)
  // به‌طور طبیعی افقی/عمودی با مومنتوم اسکرول می‌کند. JS فقط پینچ را می‌گیرد.
  // ضدِ لگِ زوم (مشکلِ «عکسِ دوم زوم می‌کنم لگ میزنه»): زومِ
  // چیدمانی (تغییرِ width) در «هر» فریمِ پینچ، همهٔ تصویرهایِ عظیمِ داخلِ
  // DOM را دوباره چیدمان+رستریزی می‌کند (هر صفحه ۲۸MP!) — با چند صفحه
  // بودجۀ رستریWebView تمام می‌شود = لگ. حالا در حینِ پینچ فقط transformِ
  // GPU (بدونِ چیدمان) با نرخِ RAF اعمال می‌شود و در «پایانِ» پینچ یک‌بار
  // چیدمانِ نهایی commit می‌شود (برندگیِ تیز مثل قبل).
  let pinch = null, pinchRaf = 0, pinchEvt = null;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });
  const clampZ = (nz) => Math.min(MAX, Math.max(MIN, +nz || 1));
  // فیکسِ «زوم می‌کنم دستم را بردارم می‌پرد بالا/پایین»: کامیتِ
  // قبلی نقطهٔ زیرِ انگشت را (scroll+mid)/z می‌گرفت؛ ولی در حینِ پینچ چیدمان
  // هنوز در startZ بود و فقط transformِ GPU با k=kz/startZ بزرگ‌نمایی می‌کرد —
  // یعنی نقطهٔ واقعیِ چیدمانیِ زیرِ انگشت (scroll+mid)/k بود، نه ÷z بعد از
  // رهاکردنِ انگشت نقطهٔ اشتباهی کانون می‌شد = پرش. حالا نقطه با k اصلاح
  // می‌شود و اگر یک انگشت باقی مانده باشد، کانون = همان انگشتِ باقی‌مانده
  // (نه وسطِ دو انگشت) تا پنِ تک‌انگشتیِ بعدش بدونِ جهش ادامه یابد.
  // فیکسِ «زوم کنم کمی میره چپ یا بالا»: اسکرول باید «با
  // ترنسفورمِ فعال» خوانده شود! پاک‌کردنِ transform، سرریزِ اسکرولی را به
  // چیدمانِ بدونِ زوم برمی‌گرداند و مرورگر همان لحظه scrollLeft/Top را به
  // مرزِ جدید گیره می‌کند (افقیِ صفحهٔ هم‌عرضِ صفحه: همیشه 0!) مقدارِ
  // خوانده‌شده خراب بود و کانونِ کامیت به هم می‌ریخت = سرخوردن در رهاکردن.
  const commitPinch = (anchor) => {
    if (pinchRaf) { cancelAnimationFrame(pinchRaf); pinchRaf = 0; }
    if (!pinch) return;
    const kz = pinch.curZ || pinch.startZ;
    const lm = anchor || pinch.lastMid;
    const k = kz / Math.max(0.01, pinch.startZ);
    const slT = s.scrollLeft, stT = s.scrollTop;  // با ترنسفورمِ فعال
    const noMove = (pinch.curZ == null) || (kz === pinch.startZ && !pinch.lastMid);
    pinch = null;
    c.style.transform = '';
    c.style.transformOrigin = '';
    c.style.willChange = '';
    if (lm) {
      const rc = s.getBoundingClientRect();
      const sx = lm.x - rc.left, sy = lm.y - rc.top;
      // نقطهٔ چیدمانیِ زیرِ lm با احتسابِ transformِ فعلی (k) — واحد: چیدمانِ
      // startZ. چیدمانِ جدید W1=baseWidth*kz = W0*k است اسکرولِ درست =
      // fx*k − sx (نه fx*kz − sx! fx*kz فقط وقتی startZ=1 درست بود؛ در
      // پینچِ دوم به بعد چیدمانِ قبلی baseWidth*startZ بود پرشِ
      // «دستم را بردارم میره پایین/بالا»). fx*k = fx*kz/startZ.
      const fx = (slT + sx) / k;
      const fy = (stT + sy) / k;
      z = kz;
      c.style.maxWidth = 'none';
      c.style.width = Math.round(baseWidth() * kz) + 'px';

      mtEl.classList.toggle('hot', dbgMode);
    }
    // منویِ گرد فقط در حالتِ دیباگ — پایین-چپ، قابلِ درگ؛
    // برگشت به نهایی = مخفی (دستورِ سازنده)
    fab.style.display = (dbgMode && ndbg > 0) ? '' : 'none';
    if (!dbgMode && (fanState || cmpOn)) {
      fanState = 0;
      updateFan();
      if (cmpOn) cmpClose();
    }
    setOvlBtns();
    updateProgress();
  }
  window.__mangaLive = function(n, tot, nd, fin) {
    try {
      isLive = true;
      if (typeof tot === 'number' && tot > 0) {
        total = tot;
        staticPh = 0; // از این‌جا به بعد total مرجع است
      }
      if (typeof nd === 'number' && nd > 0) { ndbg = nd; updateFan(); }
      // arrived در هر دو حالت به‌روز می‌شود — لیستِ نهایی حتی وقتی
      // مخفی است پر می‌شود تا برگشت به «نهایی» هیچ صفحه‌ای را از دست ندهد
      arrived = Math.max(arrived, n | 0);
      if (fin === true) sessionDone = true;
      renderLive();
    } catch (err) {}
  };
  // پیشنمایشِ ۱۵تایی: موتور بعد از هر بستهِ ترجمه، همان اسلات را
  // دوباره رندر میکند و زمانش را در mtimes.txt مینویسد؛ اینجا فقط اسلاتِ
  // عوضشده دوباره لود میشود (بدون پرش اسکرول و بازسازی کل).
  // گامِ اولِ تعویضِ بیفلاش: تصویرِ نو قبل از تعویضِ src کامل
  // دیکود میشد. ولی در WebView اندروید جوابِ shouldInterceptRequest داخلِ
  // کشِ حافظه نمیماند — درخواستِ دومِ همان URL دوباره گرفته و دیکود میشد
  // ضمنِ آن چند صدم ثانیه، عنصرِ img فریمِ قبلی را میریزد و زمینهٔ سیاه
  // نشان میداد («هر متنِ جدید صفحه سیاه میکنه انگار عکس کامل از اول لود میشه»).
  // گامِ دوم: پوشانهٔ دوبل. تصویرِ نو در یک imgِ روییِ همجایِ
  // اسلات (position:absolute رویِ همان مختصات) دیکود و «رویِ» تصویرِ قدیم
  // می‌نشیند؛ پیکسلهایِ قدیم تا این لحظه هرگز دور نمیشوند. فقط بعدِ
  // نقشدنِ پوشانه، srcِ اسلاتِ اصلی زیرِ پوشانه عوض میشود (نامرئی است) و
  // بعد از دیکودِ کاملِ اسلاتِ اصلی، پوشانه برداشته میشود. در هیچ فریمی
  // تصویرِ خالی/سیاه دیده نمیشود — نه چراغِ خاموش، نه پرشِ چیدمان.
  // اگر بهروزرسانیِ بعدیِ همان اسلات وسطِ تعویض برسد، صف میشود.
  const hotSwap = (el, url) => {
    try {
      if (!el || el.tagName !== 'IMG') return;
      if (el.getAttribute('src') === url) return;
      if (el.__swapBusy) { el.__swapNext = url; return; }
      el.__swapBusy = 1;
      const par = el.parentNode;
      if (!par) { el.__swapBusy = 0; return; }
      const ov = document.createElement('img');
      ov.alt = ''; ov.draggable = false;
      ov.style.cssText = 'position:absolute;z-index:6;pointer-events:none;user-select:none;-webkit-user-drag:none;margin:0;';
      const place = () => {
        try {
          ov.style.left = el.offsetLeft + 'px';
          ov.style.top = el.offsetTop + 'px';
          ov.style.width = el.offsetWidth + 'px';
          ov.style.height = el.offsetHeight + 'px';
        } catch (e0) {}
      };
      const cleanup = () => {
        try { ov.remove(); } catch (e4) { try { par.removeChild(ov); } catch (e6) {} }
        el.__swapBusy = 0;
        const nx = el.__swapNext; el.__swapNext = null;
        if (nx) hotSwap(el, nx);
      };
      const step2 = () => {
        // پوشانه نقشید srcِ واقعی زیرِ آن عوض میشود (هیچکس نمیبیند)
        try { el.onerror = () => cleanup(); } catch (e5) {}
        try { el.src = url; } catch (e3) { cleanup(); return; }
        const fin = () => { requestAnimationFrame(cleanup); };
        if (el.decode) { el.decode().then(fin, fin); } else { setTimeout(fin, 90); }
      };
      const cover = () => {
        try {
          if (ov.naturalWidth > 1 && ov.naturalHeight > 1)
            el.style.aspectRatio = ov.naturalWidth + '/' + ov.naturalHeight;
        } catch (e2) {}
        place();
        par.appendChild(ov);
        requestAnimationFrame(step2);
      };
      ov.src = url;
      if (ov.decode) { ov.decode().then(cover, cover); }
      else { ov.onload = cover; ov.onerror = cover; }
    } catch (err) {
      try { el.src = url; } catch (e2) {}
    }
  };
  const mgMtimes = {};
  let mgMtimesBusy = false;
  function pollMtimes() {
    if (!isLive || sessionDone || mgMtimesBusy || arrived <= 0) return;
    mgMtimesBusy = true;
    fetch('mtimes.txt?r=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.ok ? r.text() : ''; })
      .then(function(t) {
        mgMtimesBusy = false;
        if (!t) return;
        const lines = t.split('\n');
        for (let k = 0; k < lines.length; k++) {
          const p = lines[k].trim().split(/\s+/);
          if (p.length < 2) continue;
          const slot = parseInt(p[0], 10), mt = p[1];
          if (!(slot >= 1 && slot <= arrived)) continue;
          if (mgMtimes[slot] === mt) continue;
          mgMtimes[slot] = mt;
          const el = lgF.children[slot - 1];
          if (el && el.tagName === 'IMG') {
            const key = 'i/' + (slot - 1);
            // تازه از سرور + جایگزینیِ کش: اسلاتِ بیرونِ دید فقط
            // blobِ نو را میگیرد و IntersectionObserver موقعِ
            // نزدیکشدن همان لحظه نشانش میدهد (بی‌لودِ دوباره).
            imgGet(key, true).then((u) => {
              el.__blob = u; el.__cur = u;
              if (el.getAttribute('src') !== PH1) hotSwap(el, u);
            }).catch(() => {});
          }
        }
      })
      .catch(function() { mgMtimesBusy = false; });
  }
  setInterval(pollMtimes, 2500);

  // ——— دکمهٔ گردِ «منو»: قابلِ جابه‌جایی؛ با زدن، چهار دکمه دورش
  // میآیند (دیباگ/نهایی، det، p-det، rec)؛ زدنِ دوبارهٔ خودش = خطِ
  // صفحهها برای رفتنِ چپ/راست به قبل و بعد — وسطِ صفحه. ———
  const fab = document.getElementById('fab');
  let fanState = 0;   // ۰=بسته | ۱=منویِ چهارتایی | ۲=منو+خط
  const fanDefs = [
    { key: 'dbg', ic: '\ud83d\udd0d', lb: 'دیباگ' },
    { key: 'det', ic: '\u25eb', lb: 'det' },
    { key: 'pdet', ic: '\u25fa', lb: 'p-det' },
    { key: 'rec', ic: '\u25a4', lb: 'rec' }
  ];
  const fans = fanDefs.map((def) => {
    const fb = document.createElement('button');
    fb.type = 'button';
    fb.className = 'fbtn';
    fb.innerHTML = '<span class="ic"></span><span class="lb"></span>';
    fb.setAttribute('data-k', def.key);
    document.body.appendChild(fb);
    fb.addEventListener('click', (e) => {
      e.stopPropagation();
      const k = fb.getAttribute('data-k');
      if (k === 'dbg') { dbgMode = !dbgMode; applyMode(); return; }
      ov[k] = ov[k] ? 0 : 1;
      try { localStorage.setItem('mangaRdrOv', JSON.stringify(ov)); } catch (err) {}
      c.classList.toggle('no-' + k, !ov[k]);
      if (!dbgMode && ndbg > 0) { dbgMode = true; applyMode(); }
      updateFan();
    });
    return fb;
  });
  try {
    const so = JSON.parse(localStorage.getItem('mangaRdrOv') || 'null');
    if (so && typeof so === 'object')
      ov = { det: so.det ? 1 : 0, pdet: so.pdet ? 1 : 0, rec: so.rec ? 1 : 0 };
    for (const k of ['det', 'pdet', 'rec']) c.classList.toggle('no-' + k, !ov[k]);
  } catch (err) {}
  const placeFabXY = (cx, cy) => {
    const r = 30;
    const x = Math.min(Math.max(cx, r + 4), window.innerWidth - r - 4);
    const y = Math.min(Math.max(cy, r + 46), window.innerHeight - r - 8);
    fab.style.left = (x - r) + 'px';
    fab.style.top = (y - r) + 'px';
    fab.style.right = 'auto';
    fab.style.bottom = 'auto';
    fab.style.marginLeft = '0';
  };
  try {
    const sp = JSON.parse(localStorage.getItem('mangaRdrFab2') || 'null');
    if (sp && typeof sp.x === 'number') placeFabXY(sp.x, sp.y);
  } catch (err) {}
  fab.style.display = 'none';
  let fdrag = null;
  fab.addEventListener('pointerdown', (e) => {
    fdrag = { x: e.clientX, y: e.clientY, moved: false };
    try { fab.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  fab.addEventListener('pointermove', (e) => {
    if (!fdrag) return;
    const dx = e.clientX - fdrag.x, dy = e.clientY - fdrag.y;
    if (!fdrag.moved && Math.hypot(dx, dy) > 10) fdrag.moved = true;
    if (fdrag.moved) {
      fdrag.x = e.clientX; fdrag.y = e.clientY;
      placeFabXY(e.clientX, e.clientY);
      updateFan();
    }
  });
  const fabUp = () => {
    if (!fdrag) return;
    const moved = fdrag.moved;
    fdrag = null;
    if (moved) {
      try {
        const fr = fab.getBoundingClientRect();
        localStorage.setItem('mangaRdrFab2',
          JSON.stringify({ x: fr.left + fr.width / 2, y: fr.top + fr.height / 2 }));
      } catch (err) {}
      return;
    }
    if (ndbg <= 0) { fanState = 0; updateFan(); return; }
    fanState = (fanState + 1) % 3;
    updateFan();
    if (fanState === 2) cmpOpenFn();
    else if (cmpOn) cmpClose();
  };
  fab.addEventListener('pointerup', fabUp);
  fab.addEventListener('pointercancel', () => { fdrag = null; });
  const fanAngles = () => {
    const fr = fab.getBoundingClientRect();
    const up = (fr.top + fr.height / 2) > window.innerHeight * 0.45;
    return up ? [-152, -108, -72, -28] : [152, 108, 72, 28];
  };
  function updateFan() {
    const fr = fab.getBoundingClientRect();
    const cx = fr.left + fr.width / 2, cy = fr.top + fr.height / 2;
    const angs = fanAngles();
    const R = Math.min(104, Math.max(84, window.innerWidth * 0.16));
    const show = fanState >= 1 && ndbg > 0;
    for (let i = 0; i < fans.length; i++) {
      const fb = fans[i], def = fanDefs[i];
      const a = angs[i] * Math.PI / 180;
      let bx = cx + Math.cos(a) * R, by = cy + Math.sin(a) * R;
      bx = Math.min(Math.max(bx, 32), window.innerWidth - 32);
      by = Math.min(Math.max(by, 76), window.innerHeight - 32);
      fb.style.left = (bx - 29) + 'px';
      fb.style.top = (by - 29) + 'px';
      fb.querySelector('.ic').textContent =
        (def.key === 'dbg') ? (dbgMode ? '\ud83d\udcd6' : '\ud83d\udd0d') : def.ic;
      fb.querySelector('.lb').textContent =
        (def.key === 'dbg') ? (dbgMode ? 'نهایی' : 'دیباگ') : def.lb;
      fb.classList.toggle('fdbg', def.key === 'dbg');
      fb.classList.toggle('on',
        (def.key === 'dbg') ? !!dbgMode : !!ov[def.key]);
      fb.title = (def.key === 'dbg') ? 'نهایی/دیباگ' :
        ({ det: 'detector.onnx', pdet: 'paddle det', rec: 'paddle rec' })[def.key] || '';
      fb.classList.toggle('show', show);
    }
  }
  const activeList = () => (dbgMode && ndbg > 0) ? lgD : lgF;
  const stackCount = () => Math.max(1,
    (dbgMode && ndbg > 0) ? Math.max(ndbg, activeList().children.length)
                          : Math.max(arrived, total, activeList().children.length, 1));
  const curPageIdx = () => {
    const L = activeList(), rc = s.getBoundingClientRect();
    let best = 0;
    for (let i = 0; i < L.children.length; i++) {
      const ch = L.children[i];
      if ((ch.getBoundingClientRect().top - rc.top) <= s.clientHeight * 0.35) best = i;
      else break;
    }
    return best;
  };
  const goToPage = (idx) => {
    const L = activeList();
    const n = L.children.length;
    idx = Math.max(0, Math.min(n - 1, idx));
    const ch = L.children[idx];
    if (!ch) return;
    const rc = s.getBoundingClientRect();
    s.scrollTop = ch.getBoundingClientRect().top - rc.top + s.scrollTop;
  };
  // ——— «قبل/بعد»: مقایسهٔ همان صفحه — قبل = پایهٔ بی‌روکشِ دیباگ
  // (db/N، فالبکِ d/N)، بعد = خروجیِ ترجمه‌شده (i/N). خطِ عمودیِ برش با
  // کشیدن (لمس هم همینطور) جابه‌جا میشود؛ ‹ › صفحه عوض میکند. ———
  const cmpEl = document.getElementById('cmp'),
        cmpStage = document.getElementById('cmpStage'),
        cmpBWrap = document.getElementById('cmpBWrap'),
        cmpBImg = document.getElementById('cmpB'),
        cmpAImg = document.getElementById('cmpA'),
        cmpDivEl = document.getElementById('cmpDiv'),
        cmpT = document.getElementById('cmpT');
  let cmpOn = false, cmpFracV = 0.5, cmpIdx = 0;
  const cmpSet = (f) => {
    cmpFracV = Math.min(1, Math.max(0, f));
    const pc = (cmpFracV * 100).toFixed(2) + '%';
    cmpBWrap.style.clipPath = 'inset(0 0 0 ' + pc + ')';
    try { cmpBWrap.style.webkitClipPath = 'inset(0 0 0 ' + pc + ')'; } catch (err) {}
    cmpDivEl.style.left = pc;
  };
  const cmpPages = () => Math.max(1, Math.max(arrived || 0, ndbg || 0));
  const cmpLoad = (idx) => {
    const n = cmpPages();
    cmpIdx = Math.max(0, Math.min(n - 1, idx));
    const au = 'i/' + cmpIdx;
    imgGet(au).then((u) => { cmpAImg.src = u; })
      .catch(() => { cmpAImg.src = au; });
    imgGet('db/' + cmpIdx).then((u) => { cmpBImg.src = u; })
      .catch(() => {
        imgGet('d/' + cmpIdx).then((u) => { cmpBImg.src = u; })
          .catch(() => { cmpBImg.src = au; });
      });
    cmpT.textContent = 'صفحهٔ ' + (cmpIdx + 1) + ' از ' + n;
    goToPage(cmpIdx);
  };
  const cmpOpenFn = () => {
    cmpOn = true;
    cmpEl.classList.add('show');
    cmpLoad(curPageIdx());
    cmpSet(cmpFracV);
  };
  const cmpClose = () => {
    cmpOn = false;
    try { cmpEl.classList.remove('show'); } catch (err) {}
    if (fanState === 2) { fanState = 0; updateFan(); }
  };
  document.getElementById('cmpX').addEventListener('click', (e) => {
    e.stopPropagation(); cmpClose();
  });
  document.getElementById('cmpPrev').addEventListener('click', (e) => {
    e.stopPropagation(); cmpLoad(cmpIdx - 1);
  });
  document.getElementById('cmpNext').addEventListener('click', (e) => {
    e.stopPropagation(); cmpLoad(cmpIdx + 1);
  });
  let cdrag = false;
  const cmpFromX = (x) => {
    const r = cmpStage.getBoundingClientRect();
    if (r.width < 2) return;
    cmpSet((x - r.left) / r.width);
  };
  cmpStage.addEventListener('pointerdown', (e) => {
    cdrag = true;
    try { cmpStage.setPointerCapture(e.pointerId); } catch (err) {}
    cmpFromX(e.clientX);
    e.preventDefault();
  });
  cmpStage.addEventListener('pointermove', (e) => { if (cdrag) cmpFromX(e.clientX); });
  cmpStage.addEventListener('pointerup', () => { cdrag = false; });
  cmpStage.addEventListener('pointercancel', () => { cdrag = false; });
  document.addEventListener('pointerdown', (e) => {
    if (cmpOn) return;
    if (fanState === 0) return;
    if (e.target === fab || fab.contains(e.target)) return;
    for (let i = 0; i < fans.length; i++)
      if (fans[i].contains(e.target)) return;
    fanState = 0;
    updateFan();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (cmpOn) { cmpClose(); return; }
      fanState = 0; updateFan();
    }
  });
  window.addEventListener('resize', () => { updateFan(); });
  updateFan();

  if (arrived > 0 || staticPh > 0) renderLive();
  updateProgress();
})();
</script>
</body>
</html>
