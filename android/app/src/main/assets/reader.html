<!DOCTYPE html>
<!--
  نمایشگرِ درون‌برنامه‌ای: نمایشِ زنده + حالتِ دیباگ (دو لیستِ موازی همیشه
  در DOM می‌مانند؛ سوئیچ فقط نمایش/مخفی است)، زومِ کانونیِ پینچ، اسکرولِ
  طبیعیِ WebView و لودِ تدریجی (IntersectionObserver) برای رمِ کمتر.
-->
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>خواندن</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;color:#e8e6e1;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none;height:100%;overflow:hidden}.rdr{background:#000;direction:ltr;height:100%;display:flex;flex-direction:column}.rdr-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 10px;background:rgba(12,12,14,.97);border-bottom:1px solid #232326;z-index:2;flex:0 0 auto}.rdr-btn{background:#161619;color:#e8e6e1;border:1px solid #2a2a2e;border-radius:8px;padding:8px 12px;font-size:.95rem;cursor:pointer;font-family:inherit;min-width:40px;min-height:40px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.rdr-btn:active{background:#2a2a30}.rdr-btn.fs{background:#ff4a3d;border-color:#ff4a3d;color:#fff;font-weight:700}.rdr-title{flex:1 1 120px;color:#97948c;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;direction:rtl;min-width:0}.rdrS{flex:1 1 auto;overflow:auto;position:relative;background:#000;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y}.rdrC{margin:0 auto;max-width:min(100%,900px);width:100%}.rdrC .lg{width:100%;position:relative}.rdrC .lg[hidden]{display:none}.rdrC img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;background:#0b0b0d}.dslot{position:relative;width:100%}.dslot>svg.dovl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:block}.rdrC.no-det .g-det{display:none}.rdrC.no-pdet .g-pdet{display:none}.rdrC.no-rec .g-rec{display:none}.rdr-progress{position:fixed;bottom:0;left:0;right:0;height:3px;background:#1a1a1c;z-index:3}.rdrB{height:100%;width:0;background:linear-gradient(90deg,#ff4a3d,#ff8a5e)}.zlv{color:#97948c;font-size:.8rem;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}.ph{width:100%;direction:rtl;aspect-ratio:2/3;background:linear-gradient(100deg,#101012 40%,#17171a 50%,#101012 60%);background-size:200% 100%;animation:shph 1.6s infinite;border-radius:10px;margin:0 0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#5d5b55;font-size:.8rem}@keyframes shph{0%{background-position:120% 0}100%{background-position:-80% 0}}.sp{width:26px;height:26px;border-radius:50%;border:3px solid #26262a;border-top-color:#ff4a3d;animation:spinph 1s linear infinite}@keyframes spinph{to{transform:rotate(360deg)}}@media (max-width:480px){.rdr-bar{gap:4px;padding:6px 8px}.rdr-btn{padding:7px 10px;font-size:.9rem;min-width:36px}.rdr-title{font-size:.72rem;order:10;flex:1 1 100%;text-align:center}}</style>
</head>
<body>
<div class="rdr" id="manga_rdr" data-zoom="1">
  <div class="rdr-bar">
    <button type="button" class="rdr-btn" data-act="close" title="بستن">✕</button>
    <div class="rdr-title">__TITLE__</div>
    <button type="button" class="rdr-btn" data-act="zoom-out" title="دور">−</button>
    <span class="zlv">100%</span>
    <button type="button" class="rdr-btn" data-act="zoom-in" title="نزدیک">+</button>
    <button type="button" class="rdr-btn" data-act="zoom-fit" title="پهنای صفحه">پهنا</button>
    <button type="button" class="rdr-btn fs" data-act="fs" title="فول‌اسکرین">⛶</button>
    <button type="button" class="rdr-btn" data-act="dbg" hidden title="سوئیچ دیباگ زنده">🔍 دیباگ</button>
    <button type="button" class="rdr-btn fs" data-act="ov-det" hidden title="detector.onnx">det</button>
    <button type="button" class="rdr-btn fs" data-act="ov-pdet" hidden title="paddle det">p-det</button>
    <button type="button" class="rdr-btn fs" data-act="ov-rec" hidden title="paddle rec">rec</button>
  </div>
  <div class="rdrS"><div class="rdrC">__IMGS__</div></div>
  <div class="rdr-progress"><div class="rdrB"></div></div>
</div>
<script>
(function(){
  const root = document.getElementById('manga_rdr');
  if (!root) return;
  const s = root.querySelector('.rdrS');
  const c = root.querySelector('.rdrC');
  const bar = root.querySelector('.zlv');
  const prog = root.querySelector('.rdrB');
  if (!c || !s) return;
  let z = 1;
  const MIN = 0.5, MAX = 4;
  const baseWidth = () => Math.max(200, Math.min(900, s.clientWidth || window.innerWidth || 360));
  // زومِ کانونی نسبت به خودِ اسکرولر — نقطهٔ زیرِ انگشت ثابت می‌ماند
  const applyZoom = (nz, cx, cy) => {
    nz = Math.min(MAX, Math.max(MIN, +nz || 1));
    const rc = s.getBoundingClientRect();
    const sx = (typeof cx === 'number') ? (cx - rc.left) : (rc.width / 2);
    const sy = (typeof cy === 'number') ? (cy - rc.top) : (rc.height / 2);
    const fx = (s.scrollLeft + sx) / Math.max(0.01, z);
    const fy = (s.scrollTop + sy) / Math.max(0.01, z);
    z = nz;
    c.style.maxWidth = 'none';
    c.style.width = Math.round(baseWidth() * z) + 'px';
    s.scrollLeft = Math.max(0, fx * z - sx);
    s.scrollTop = Math.max(0, fy * z - sy);
    if (bar) bar.textContent = Math.round(z * 100) + '%';
    root.dataset.zoom = String(z);
  };
  const setZoom = (nz) => applyZoom(nz);
  const zoomBy = (f, cx, cy) => applyZoom(z * f, cx, cy);
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn || !root.contains(btn)) return;
    e.preventDefault();
    const act = btn.getAttribute('data-act');
    if (act === 'close') {
      try {
        const isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (isFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } catch (err) {}
      try { window.close(); } catch (err) {}
      try { if (history.length > 1) history.back(); } catch (err) {}
      return;
    }
    if (act === 'dbg') {
      dbgMode = !dbgMode;
      btn.textContent = dbgMode ? '\ud83d\udcd6 نهایی' : '🔍 دیباگ';
      btn.classList.toggle('fs', dbgMode);
      applyMode();
      return;
    }
    else if (act === 'ov-det' || act === 'ov-pdet' || act === 'ov-rec') {
      const k = act.slice(3);
      ov[k] = ov[k] ? 0 : 1;
      btn.classList.toggle('fs', !!ov[k]);
      // فقط کلاسِ CSS رویِ ظلعوض میشود — نه رفرش، نه تعویضِ
      // عکس؛ جعبههایِ SVG همان لحظه پنهان/پیدا میشوند
      c.classList.toggle('no-' + k, !ov[k]);
      return;
    }
    else if (act === 'zoom-in') zoomBy(1.25);
    else if (act === 'zoom-out') zoomBy(0.8);
    else if (act === 'zoom-fit') setZoom(1);
    else if (act === 'fs') {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement
                || document.mozFullScreenElement || document.msFullscreenElement;
      if (isFs) {
        (document.exitFullscreen || document.webkitExitFullscreen
         || document.mozCancelFullScreen || document.msExitFullscreen).call(document);
      } else {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen
                 || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) {
          try { req.call(el); } catch (err) {
            try { req.call(root); } catch (err2) {}
          }
        }
      }
    }
  });
  window.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
  }, { passive: false });
  window.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if (z > 1.3) setZoom(1);
    else zoomBy(2.2, e.clientX, e.clientY);
  });
  // پنِ تک‌انگشتی به WebView سپرده شد — درگ روی .rdrS (overflow:auto)
  // به‌طور طبیعی افقی/عمودی با مومنتوم اسکرول می‌کند. JS فقط پینچ را می‌گیرد.
  // ضدِ لگِ زوم (مشکلِ «عکسِ دوم زوم می‌کنم لگ میزنه»): زومِ
  // چیدمانی (تغییرِ width) در «هر» فریمِ پینچ، همهٔ تصویرهایِ عظیمِ داخلِ
  // DOM را دوباره چیدمان+رستریزی می‌کند (هر صفحه ۲۸MP!) — با چند صفحه
  // بودجۀ رستریWebView تمام می‌شود = لگ. حالا در حینِ پینچ فقط transformِ
  // GPU (بدونِ چیدمان) با نرخِ RAF اعمال می‌شود و در «پایانِ» پینچ یک‌بار
  // چیدمانِ نهایی commit می‌شود (برندگیِ تیز مثل قبل).
  let pinch = null, pinchRaf = 0, pinchEvt = null;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });
  const clampZ = (nz) => Math.min(MAX, Math.max(MIN, +nz || 1));
  // فیکسِ «زوم می‌کنم دستم را بردارم می‌پرد بالا/پایین»: کامیتِ
  // قبلی نقطهٔ زیرِ انگشت را (scroll+mid)/z می‌گرفت؛ ولی در حینِ پینچ چیدمان
  // هنوز در startZ بود و فقط transformِ GPU با k=kz/startZ بزرگ‌نمایی می‌کرد —
  // یعنی نقطهٔ واقعیِ چیدمانیِ زیرِ انگشت (scroll+mid)/k بود، نه ÷z بعد از
  // رهاکردنِ انگشت نقطهٔ اشتباهی کانون می‌شد = پرش. حالا نقطه با k اصلاح
  // می‌شود و اگر یک انگشت باقی مانده باشد، کانون = همان انگشتِ باقی‌مانده
  // (نه وسطِ دو انگشت) تا پنِ تک‌انگشتیِ بعدش بدونِ جهش ادامه یابد.
  // فیکسِ «زوم کنم کمی میره چپ یا بالا»: اسکرول باید «با
  // ترنسفورمِ فعال» خوانده شود! پاک‌کردنِ transform، سرریزِ اسکرولی را به
  // چیدمانِ بدونِ زوم برمی‌گرداند و مرورگر همان لحظه scrollLeft/Top را به
  // مرزِ جدید گیره می‌کند (افقیِ صفحهٔ هم‌عرضِ صفحه: همیشه 0!) مقدارِ
  // خوانده‌شده خراب بود و کانونِ کامیت به هم می‌ریخت = سرخوردن در رهاکردن.
  const commitPinch = (anchor) => {
    if (pinchRaf) { cancelAnimationFrame(pinchRaf); pinchRaf = 0; }
    if (!pinch) return;
    const kz = pinch.curZ || pinch.startZ;
    const lm = anchor || pinch.lastMid;
    const k = kz / Math.max(0.01, pinch.startZ);
    const slT = s.scrollLeft, stT = s.scrollTop;  // با ترنسفورمِ فعال
    const noMove = (pinch.curZ == null) || (kz === pinch.startZ && !pinch.lastMid);
    pinch = null;
    c.style.transform = '';
    c.style.transformOrigin = '';
    c.style.willChange = '';
    if (lm) {
      const rc = s.getBoundingClientRect();
      const sx = lm.x - rc.left, sy = lm.y - rc.top;
      // نقطهٔ چیدمانیِ زیرِ lm با احتسابِ transformِ فعلی (k) — واحد: چیدمانِ
      // startZ. چیدمانِ جدید W1=baseWidth*kz = W0*k است اسکرولِ درست =
      // fx*k − sx (نه fx*kz − sx! fx*kz فقط وقتی startZ=1 درست بود؛ در
      // پینچِ دوم به بعد چیدمانِ قبلی baseWidth*startZ بود پرشِ
      // «دستم را بردارم میره پایین/بالا»). fx*k = fx*kz/startZ.
      const fx = (slT + sx) / k;
      const fy = (stT + sy) / k;
      z = kz;
      c.style.maxWidth = 'none';
      c.style.width = Math.round(baseWidth() * kz) + 'px';
      s.scrollLeft = Math.max(0, fx * k - sx);
      s.scrollTop = Math.max(0, fy * k - sy);
      if (bar) bar.textContent = Math.round(kz * 100) + '%';
      root.dataset.zoom = String(z);
    } else if (noMove) {
      // پینچِ بدونِ هیچ حرکتی (تپِ دومنگشتی): هیچ چیز نباید جابه‌جا شود
      if (bar) bar.textContent = Math.round(kz * 100) + '%';
    } else {
      applyZoom(kz);
    }
  };
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      // اگر پینچِ قبلی وسطِ کار بود اول commit کن
      if (pinch) commitPinch();
      pinch = {
        startDist: dist(e.touches[0], e.touches[1]),
        startZ: z, curZ: z,
        F: null,        // نقطهٔ محتواییِ زیرِ وسطِ انگشت‌ها (مختصاتِ چیدمان)
        lastMid: null
      };
      c.style.willChange = 'transform';
      c.style.transformOrigin = '0 0';
    }
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      pinchEvt = e;
      if (!pinchRaf) {
        pinchRaf = requestAnimationFrame(() => {
          pinchRaf = 0;
          if (!pinch || !pinchEvt) return;
          const ev = pinchEvt; pinchEvt = null;
          const d = dist(ev.touches[0], ev.touches[1]);
          const m = mid(ev.touches[0], ev.touches[1]);
          const kz = clampZ(pinch.startZ * (d / Math.max(1, pinch.startDist)));
          // k نسبت به «چیدمان» است که هنوز در startZ است
          const k = kz / Math.max(0.01, pinch.startZ);
          // تبدیلِ GPU: فقط رستریِ لایه — هیچ چیدمانِ دوباره
          c.style.transform = 'scale(' + k + ')';
          const rc = s.getBoundingClientRect();
          const mx = m.x - rc.left, my = m.y - rc.top;
          // فیکسِ «زوم می‌کنم میره پایین»: قبلاً اسکرول با
          // فرمولِ بازگشتیِ (scroll+mid)*k−mid روی مقدارِ «قبلیِ» خودش
          // اعمال می‌شد؛ هر فریم در k>1 ضربِ دوباره می‌شد اسکرول به‌صورت
          // تصاعدی به پایین می‌رفت. حالا «مطلق»: نقطهٔ محتواییِ F یک‌بار در
          // شروعِ پینچ قفل می‌شود و اسکرول هر فریم = F*k − midِ فعلی —
          // بدونِ پس‌خور؛ حرکتِ انگشت‌ها هم پنِ طبیعی می‌دهد.
          if (!pinch.F) pinch.F = { x: s.scrollLeft + mx, y: s.scrollTop + my };
          // اسکرول ممکن است به مرزِ چیدمان بخورد (ناحیهٔ دیده‌شدهٔ
          // transform بزرگ‌تر از چیدمان است) — اگر خورد، کانون را به وضعیتِ
          // واقعی قفل کن تا فریم‌های بعدی از همان‌جا ادامه دهند (بدونِ جهش)
          const mX = s.scrollWidth - s.clientWidth, mY = s.scrollHeight - s.clientHeight;
          const wX = pinch.F.x * k - mx, wY = pinch.F.y * k - my;
          const tX = Math.max(0, Math.min(mX, wX));
          const tY = Math.max(0, Math.min(mY, wY));
          s.scrollLeft = tX; s.scrollTop = tY;
          if (tX !== wX) pinch.F.x = (tX + mx) / k;
          if (tY !== wY) pinch.F.y = (tY + my) / k;
          pinch.curZ = kz;
          pinch.lastMid = { x: m.x, y: m.y };
          if (bar) bar.textContent = Math.round(kz * 100) + '%';
        });
      }
    }
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    // اگر یک انگشت باقی مانده، همان انگشت کانونِ کامیت شود
    if (pinch && e.touches.length < 2)
      commitPinch(e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null);
  });
  document.addEventListener('touchcancel', () => commitPinch());
  const updateProgress = () => {
    if (!prog) return;
    const m = s.scrollHeight - s.clientHeight;
    prog.style.width = (m > 0 ? Math.min(100, Math.max(0, s.scrollTop / m * 100)) : 0) + '%';
  };
  s.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', () => { if (z !== 1) applyZoom(z); updateProgress(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      try {
        const isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (isFs) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      } catch (err) {}
      try { window.close(); } catch (err) {}
    } else if (e.key === '+' || e.key === '=') zoomBy(1.15);
    else if (e.key === '-' || e.key === '_') zoomBy(0.87);
    else if (e.key === '0') setZoom(1);
    else if (e.key === 'f' || e.key === 'F') {
      const btn = root.querySelector('[data-act="fs"]');
      if (btn) btn.click();
    }
  });
  // نمایش زنده داخل خواننده + سوئیچ دیباگ (: دو لیستِ موازی) ———
  // دیباگ هم زنده. : لیستِ نهایی و لیستِ دیباگ هر دو همیشه در
  // DOM می‌مانند (لیستِ غیرفعال فقط مخفی است) سوئیچ هیچ‌چیز را نابود/بازسازی
  // نمی‌کند، تصویرها دوباره لود نمی‌شوند، اسکرولِ هر حالت جدا به‌خاطر سپرده
  // می‌شود و به‌روزرسانیِ زنده به لیستِ مخفی هم اعمال می‌شود = «از نمایش زنده
  // در نمی‌افتد».
  // ——— کلیدهایِ روکشِ دیباگ: هر موتور جدا روشن/خاموش ———
  // عکسِ پایهٔ بی‌روکش (db/i) همیشه سرِ جایش میماند؛ جعبهها
  // «SVG» رویِ خودش کشیده میشوند. روشن/خاموشکردنِ هر کلید فقط
  // یک کلاسِ CSS رویِ ظلعوض میکند — نه رفرش، نه لودِ دوباره،
  // نه تعویضِ عکس. لحظه‌ای است.
  let ov = { det: 1, pdet: 1, rec: 1 };
  const ovBtns = { det: root.querySelector('[data-act="ov-det"]'),
                   pdet: root.querySelector('[data-act="ov-pdet"]'),
                   rec: root.querySelector('[data-act="ov-rec"]') };
  const ovCache = {};
  const SVGNS = 'http://www.w3.org/2000/svg';
  const svgEl = (t, at) => {
    const e = document.createElementNS(SVGNS, t);
    for (const k in at) e.setAttribute(k, at[k]);
    return e;
  };
  const buildOvlSvg = (j) => {
    const W = (j.size && j.size[0]) || 900, H = (j.size && j.size[1]) || 1200;
    const svg = svgEl('svg', { 'class': 'dovl',
                               'viewBox': '0 0 ' + W + ' ' + H,
                               'preserveAspectRatio': 'none' });
    const gDet = svgEl('g', { 'class': 'g-det' });
    const gPdet = svgEl('g', { 'class': 'g-pdet' });
    const gRec = svgEl('g', { 'class': 'g-rec' });
    if (j.det) {
      const sw = Math.max(2, W / 300), fs = Math.max(12, Math.round(W / 45));
      for (let i = 0; i < j.det.length; i++) {
        const d = j.det[i];
        gDet.appendChild(svgEl('rect', {
          x: d[0], y: d[1], width: Math.max(1, d[2] - d[0]),
          height: Math.max(1, d[3] - d[1]),
          fill: 'none', stroke: '#00e640', 'stroke-width': sw }));
        const t = svgEl('text', { x: d[0] + 4, y: d[1] + Math.max(12, fs),
                                  fill: '#00e640', 'font-size': fs,
                                  'font-weight': 'bold',
                                  'font-family': 'sans-serif' });
        t.textContent = 'D' + ('0' + i).slice(-2) + ' ' + (d[4] || '');
        gDet.appendChild(t);
      }
    }
    if (j.pdet) {
      const sw2 = Math.max(2, W / 340);
      for (let k = 0; k < j.pdet.length; k++) {
        const q = j.pdet[k];
        if (!q || q.length < 2) continue;
        const pts = [];
        for (let p2 = 0; p2 < q.length; p2++) pts.push(q[p2][0] + ',' + q[p2][1]);
        gPdet.appendChild(svgEl('polygon', { points: pts.join(' '),
                                             fill: 'none', stroke: '#3a8bff',
                                             'stroke-width': sw2 }));
      }
    }
    if (j.rec) {
      const sw3 = Math.max(1.5, W / 380), fs2 = Math.max(11, Math.round(W / 50));
      for (let m = 0; m < j.rec.length; m++) {
        const r = j.rec[m];
        const col = (r[4] === 'promo') ? '#ff9f0a' : '#ff3b30';
        gRec.appendChild(svgEl('rect', { x: r[0], y: r[1],
                                         width: Math.max(1, r[2]),
                                         height: Math.max(1, r[3]),
                                         fill: 'none', stroke: col,
                                         'stroke-width': sw3 }));
        if (r[5]) {
          const t2 = svgEl('text', { x: r[0],
                                     y: Math.max(fs2, r[1] - Math.round(W / 42)),
                                     fill: (r[4] === 'promo') ? '#ff9f0a' : '#ffd60a',
                                     'font-size': fs2,
                                     'font-family': 'sans-serif' });
          t2.textContent = ('[' + m + '] ' + r[5]).slice(0, 44);
          gRec.appendChild(t2);
        }
      }
    }
    svg.appendChild(gDet); svg.appendChild(gPdet); svg.appendChild(gRec);
    return svg;
  };
  const putOvl = (el, j) => {
    try {
      const old = el.querySelectorAll('svg.dovl');
      for (let i = 0; i < old.length; i++) {
        if (old[i].parentNode === el) el.removeChild(old[i]);
      }
      el.appendChild(buildOvlSvg(j));
    } catch (err) {}
  };
  const ensureOvlIdx = (i, el) => {
    if (!el || el.__ovlBusy) return;
    const cc = ovCache[i];
    if (cc && cc.ok) {
      if (!el.querySelector('svg.dovl')) putOvl(el, cc.j);
      return;
    }
    if (cc && !cc.ok && (Date.now() - cc.t) < 5000) return;
    el.__ovlBusy = 1;
    fetch('dj/' + i)
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        if (!j) { ovCache[i] = { ok: 0, t: Date.now() }; return; }
        ovCache[i] = { ok: 1, j: j };
        putOvl(el, j);
      })
      .catch(() => { ovCache[i] = { ok: 0, t: Date.now() }; })
      .then(() => { el.__ovlBusy = 0; });
  };
  function setOvlBtns() {
    for (const k in ovBtns) {
      const b = ovBtns[k];
      if (b) { b.hidden = !dbgMode || ndbg <= 0; b.classList.toggle('fs', !!ov[k]); }
    }
  }
  let dbgMode = false, arrived = 0, total = 0, ndbg = 0;
  let isLive = false, sessionDone = false;
  // دو لیستِ موازی: lgF = نهایی، lgD = دیباگ ———
  // تصویرها/اسلات‌های استاتیکِ تزریقیِ اندروید مستقیماً داخل .rdrC هستند
  // همه به لیستِ نهایی منتقل می‌شوند و لیستِ دیباگ کنارشان ساخته می‌شود.
  const lgF = document.createElement('div');
  lgF.className = 'lg lgF';
  const lgD = document.createElement('div');
  lgD.className = 'lg lgD';
  lgD.hidden = true;
  while (c.firstChild) lgF.appendChild(c.firstChild);
  c.appendChild(lgF);
  c.appendChild(lgD);
  // : لودِ تدریجی برای رمِ کمتر («نمایش زنده کم کم لود کنه») ———
  // تصویرها تا ۲۸ مگاپیکسل‌اند؛ هر کدام ~۱۱۰MB بیت‌مپِ دیکودشده می‌خواهد و
  // WebView با چند صفحه خفه می‌شود. حالا فقط نوارِ اطرافِ دید (±۲.۲ برابرِ
  // ارتفاعِ دید) نگه داشته می‌شود؛ صفحاتِ دور به placeholderِ ۱px برمی‌گردند
  // (اول aspect-ratio از اندازهٔ واقعی قفل می‌شود تا چیدمان و اسکرول ذره‌ای
  // تکان نخورد) و با نزدیک‌شدن دوباره لود می‌شوند = لودِ «کم‌کم». لیستِ مخفی
  // (display:none) همیشه کاملاً تخلیه است و هنگام سوئیچ از نو لود می‌شود.
  const PH1 = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  const mgIO = ('IntersectionObserver' in window) ? new IntersectionObserver((es) => {
    for (const en of es) {
      const im = en.target;
      if (en.isIntersecting) {
        const r = im.dataset.src || '';
        if (r && im.getAttribute('src') !== r) im.setAttribute('src', r);
      } else if (im.naturalWidth > 1 && im.naturalHeight > 1) {
        // >1: placeholderِ ۱px هرگز aspect-ratio را با ۱/۱ بازنویسی نکند
        try { im.style.aspectRatio = im.naturalWidth + '/' + im.naturalHeight; } catch (err) {}
        if (im.getAttribute('src') !== PH1) im.setAttribute('src', PH1);
      }
    }
  }, { root: s, rootMargin: '220% 0px 220% 0px' }) : null;
  const mgImg = (im) => {
    if (!mgIO || !im || im.__mgd) return;
    im.__mgd = 1;
    if (!im.dataset.src) im.dataset.src = im.getAttribute('src') || '';
    try { mgIO.observe(im); } catch (err) {}
  };
  const mkImg = (i, dbg, eager) => {
    if (!dbg) {
      const im = document.createElement('img');
      im.src = 'i/' + i;
      im.dataset.src = im.src;
      im.loading = 'lazy';
      im.decoding = 'async';
      im.alt = '';
      im.draggable = false;
      mgImg(im);
      return im;
    }
    // دیباگ: پایهٔ بی‌روکش (db/) + روکشِ SVG؛ تصویرِ سوختهٔ d/
    // فقط فالبکِ وقتی است که پایه وجود ندارد
    const w = document.createElement('div');
    w.className = 'dslot';
    const im = document.createElement('img');
    im.dataset.src = 'db/' + i;
    im.loading = eager ? 'eager' : 'lazy';
    im.decoding = 'async';
    im.alt = '';
    im.draggable = false;
    im.onerror = () => {
      if (String(im.dataset.src || '').indexOf('db/') === 0) {
        im.dataset.src = 'd/' + i;
        if (im.getAttribute('src') !== PH1) im.src = 'd/' + i;
        try { w.dataset.baked = '1'; } catch (err) {}
      }
    };
    im.src = 'db/' + i;
    mgImg(im);
    w.appendChild(im);
    return w;
  };
  const slotFilled = (el) => !!el && (el.tagName === 'IMG' ||
    (el.classList && el.classList.contains('dslot') &&
     el.firstChild && el.firstChild.tagName === 'IMG'));
  arrived = lgF.querySelectorAll('img').length;
  // تصویرهایِ تزریقیِ استاتیکِ اندروید هم تحتِ مدیریتِ لودِ تدریجی
  try { lgF.querySelectorAll('img').forEach(mgImg); } catch (err) {}
  const scrollMem = { final: 0, dbg: 0 };
  try {
    const tb0 = root.querySelector('[data-act="dbg"]');
    ndbg = tb0 ? (parseInt(tb0.getAttribute('data-ndbg') || '0', 10) || 0) : 0;
  } catch (err) { ndbg = 0; }
  const mkPh = () => {
    const d = document.createElement('div');
    d.className = 'ph';
    d.innerHTML = '<span class="sp"></span>در حال ترجمه…';
    return d;
  };
  // تعدادِ اسلاتِ «در حال ترجمه» که در اولین رندر تزریق شده — بعد از اولین
  // __mangaLive این عدد با total جایگزین می‌شود ( هم همین بود)
  let staticPh = lgF.querySelectorAll('.ph').length;
  function renderFinal() {
    let want = arrived + (total > 0 ? Math.max(0, total - arrived) : staticPh);
    if (total > 0) want = Math.max(total, arrived);
    while (lgF.children.length < want) lgF.appendChild(mkPh());
    // اسلاتِ اضافه جمع شود — اگر اندروید بیشتر از totalِ واقعی اسلات
    // تزریق کرده باشد، placeholderِ سرگردانِ «در حال ترجمه…» برای همیشه آخرِ
    // لیست می‌ماند (تصویرها هرگز حذف نمی‌شوند؛ فقط placeholderِ انتهایی)
    if (total > 0) {
      while (lgF.children.length > want &&
             lgF.children[lgF.children.length - 1].className === 'ph') {
        lgF.removeChild(lgF.lastChild);
      }
    }
    for (let i = 0; i < arrived && i < lgF.children.length; i++) {
      const el = lgF.children[i];
      if (el && el.tagName !== 'IMG' && !el.__pend) {
        // ضدِ چشمکِ اسلاتِ تازه: قبلاً placeholder بلافاصله با
        // imgِ خالی عوض میشد تا دیکود، زمینهٔ تیره دیده میشد («چراغِ
        // خاموش»). حالا تصویر اول بیرون از DOM کامل دیکود میشود
        // placeholder تا آخرین لحظه سرِ جایش میماند و بعد عوض میشود.
        el.__pend = 1;
        const im = document.createElement('img');
        im.src = 'i/' + i;
        im.dataset.src = im.src;
        im.loading = 'eager';      // تصویرِ جدا از DOM: lazy هرگز نمیآید
        im.decoding = 'async';
        im.alt = ''; im.draggable = false;
        const put = () => {
          if (im.parentNode) return;
          const cur = lgF.children[i];
          if (cur && cur.tagName !== 'IMG' && cur.__pend) {
            lgF.replaceChild(im, cur);
            mgImg(im);             // لودِ تدریجی بعد از درج
          }
        };
        if (im.decode) { im.decode().then(put, put); }
        else { im.onload = put; im.onerror = put; }
      }
    }
  }
  function renderDbg() {
    let w = ndbg;
    if (isLive && !sessionDone) w += 1; // اسلاتِ زندهٔ آخرِ لیست
    while (lgD.children.length < w) lgD.appendChild(mkPh());
    // با پایانِ نشست، اسلاتِ اضافه فقط وقتی جمع می‌شود که واقعاً placeholder است
    if (!isLive || sessionDone) {
      while (lgD.children.length > ndbg &&
             lgD.children[lgD.children.length - 1].className === 'ph') {
        lgD.removeChild(lgD.lastChild);
      }
    }
    for (let i = 0; i < ndbg && i < lgD.children.length; i++) {
      const el = lgD.children[i];
      if (el && !slotFilled(el) && !el.__pend) {
        // همان ضدِ چشمکِ اسلاتِ تازه، برایِ لیستِ دیباگ —
        // پایهٔ بیروکش + روکشِ SVG (db/ + dj/)
        el.__pend = 1;
        const node = mkImg(i, true, true);
        const im = node.firstChild;
        const put = () => {
          if (node.parentNode) return;
          const cur = lgD.children[i];
          if (cur && !slotFilled(cur) && cur.__pend) {
            lgD.replaceChild(node, cur);
            // روکشِ SVG بعد از نشستنِ اسلات وصل میشود
            ensureOvlIdx(i, node);
          }
        };
        if (im.decode) { im.decode().then(put, put); }
        else { im.onload = put; im.onerror = put; }
      }
    }
  }
  function renderLive() {
    renderFinal();
    renderDbg();
    updateProgress();
  }
  function applyMode() {
    // فقط نمایش/مخفی + بازیابیِ اسکرولِ همان حالت — بدونِ بازسازی
    scrollMem[dbgMode ? 'final' : 'dbg'] = s.scrollTop; // اسکرولِ حالتِ قبلی
    lgF.hidden = dbgMode;
    lgD.hidden = !dbgMode;
    s.scrollTop = Math.min(scrollMem[dbgMode ? 'dbg' : 'final'],
                           Math.max(0, s.scrollHeight - s.clientHeight));
    setOvlBtns();
    updateProgress();
  }
  window.__mangaLive = function(n, tot, nd, fin) {
    try {
      isLive = true;
      if (typeof tot === 'number' && tot > 0) {
        total = tot;
        staticPh = 0; // از این‌جا به بعد total مرجع است
      }
      if (typeof nd === 'number' && nd > 0) {
        ndbg = nd;
        const tb = root.querySelector('[data-act="dbg"]');
        if (tb) {
          tb.hidden = false;
          tb.style.background = '#b3261e';
          tb.style.borderColor = '#d64545';
          tb.style.color = '#fff';
          tb.style.fontWeight = '700';
        }
      }
      // arrived در هر دو حالت به‌روز می‌شود — لیستِ نهایی حتی وقتی
      // مخفی است پر می‌شود تا برگشت به «نهایی» هیچ صفحه‌ای را از دست ندهد
      arrived = Math.max(arrived, n | 0);
      if (fin === true) sessionDone = true;
      renderLive();
    } catch (err) {}
  };
  // پیشنمایشِ ۱۵تایی: موتور بعد از هر بستهِ ترجمه، همان اسلات را
  // دوباره رندر میکند و زمانش را در mtimes.txt مینویسد؛ اینجا فقط اسلاتِ
  // عوضشده دوباره لود میشود (بدون پرش اسکرول و بازسازی کل).
  // گامِ اولِ تعویضِ بیفلاش: تصویرِ نو قبل از تعویضِ src کامل
  // دیکود میشد. ولی در WebView اندروید جوابِ shouldInterceptRequest داخلِ
  // کشِ حافظه نمیماند — درخواستِ دومِ همان URL دوباره گرفته و دیکود میشد
  // ضمنِ آن چند صدم ثانیه، عنصرِ img فریمِ قبلی را میریزد و زمینهٔ سیاه
  // نشان میداد («هر متنِ جدید صفحه سیاه میکنه انگار عکس کامل از اول لود میشه»).
  // گامِ دوم: پوشانهٔ دوبل. تصویرِ نو در یک imgِ روییِ همجایِ
  // اسلات (position:absolute رویِ همان مختصات) دیکود و «رویِ» تصویرِ قدیم
  // می‌نشیند؛ پیکسلهایِ قدیم تا این لحظه هرگز دور نمیشوند. فقط بعدِ
  // نقشدنِ پوشانه، srcِ اسلاتِ اصلی زیرِ پوشانه عوض میشود (نامرئی است) و
  // بعد از دیکودِ کاملِ اسلاتِ اصلی، پوشانه برداشته میشود. در هیچ فریمی
  // تصویرِ خالی/سیاه دیده نمیشود — نه چراغِ خاموش، نه پرشِ چیدمان.
  // اگر بهروزرسانیِ بعدیِ همان اسلات وسطِ تعویض برسد، صف میشود.
  const hotSwap = (el, url) => {
    try {
      if (!el || el.tagName !== 'IMG') return;
      if (el.getAttribute('src') === url) return;
      if (el.__swapBusy) { el.__swapNext = url; return; }
      el.__swapBusy = 1;
      const par = el.parentNode;
      if (!par) { el.__swapBusy = 0; return; }
      const ov = document.createElement('img');
      ov.alt = ''; ov.draggable = false;
      ov.style.cssText = 'position:absolute;z-index:6;pointer-events:none;user-select:none;-webkit-user-drag:none;margin:0;';
      const place = () => {
        try {
          ov.style.left = el.offsetLeft + 'px';
          ov.style.top = el.offsetTop + 'px';
          ov.style.width = el.offsetWidth + 'px';
          ov.style.height = el.offsetHeight + 'px';
        } catch (e0) {}
      };
      const cleanup = () => {
        try { ov.remove(); } catch (e4) { try { par.removeChild(ov); } catch (e6) {} }
        el.__swapBusy = 0;
        const nx = el.__swapNext; el.__swapNext = null;
        if (nx) hotSwap(el, nx);
      };
      const step2 = () => {
        // پوشانه نقشید srcِ واقعی زیرِ آن عوض میشود (هیچکس نمیبیند)
        try { el.onerror = () => cleanup(); } catch (e5) {}
        try { el.src = url; } catch (e3) { cleanup(); return; }
        const fin = () => { requestAnimationFrame(cleanup); };
        if (el.decode) { el.decode().then(fin, fin); } else { setTimeout(fin, 90); }
      };
      const cover = () => {
        try {
          if (ov.naturalWidth > 1 && ov.naturalHeight > 1)
            el.style.aspectRatio = ov.naturalWidth + '/' + ov.naturalHeight;
        } catch (e2) {}
        place();
        par.appendChild(ov);
        requestAnimationFrame(step2);
      };
      ov.src = url;
      if (ov.decode) { ov.decode().then(cover, cover); }
      else { ov.onload = cover; ov.onerror = cover; }
    } catch (err) {
      try { el.src = url; } catch (e2) {}
    }
  };
  const mgMtimes = {};
  let mgMtimesBusy = false;
  function pollMtimes() {
    if (!isLive || sessionDone || mgMtimesBusy || arrived <= 0) return;
    mgMtimesBusy = true;
    fetch('mtimes.txt?r=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.ok ? r.text() : ''; })
      .then(function(t) {
        mgMtimesBusy = false;
        if (!t) return;
        const lines = t.split('\n');
        for (let k = 0; k < lines.length; k++) {
          const p = lines[k].trim().split(/\s+/);
          if (p.length < 2) continue;
          const slot = parseInt(p[0], 10), mt = p[1];
          if (!(slot >= 1 && slot <= arrived)) continue;
          if (mgMtimes[slot] === mt) continue;
          mgMtimes[slot] = mt;
          const el = lgF.children[slot - 1];
          if (el && el.tagName === 'IMG') {
            const nu = 'i/' + (slot - 1) + '?r=' + Date.now();
            el.dataset.src = nu;
            // src فقط وقتی عوض میشود که تصویرِ نو کامل دیکود
            // شده باشد؛ اسلاتِ بیرونِ دید (src=PH1) فقط dataset.src تازه
            // میگیرد و IntersectionObserver موقعِ نزدیکشدن خودش لود میکند.
            if (el.getAttribute('src') !== PH1) hotSwap(el, nu);
          }
        }
      })
      .catch(function() { mgMtimesBusy = false; });
  }
  setInterval(pollMtimes, 2500);

  if (arrived > 0 || staticPh > 0) renderLive();
  updateProgress();
})();
</script>
</body>
