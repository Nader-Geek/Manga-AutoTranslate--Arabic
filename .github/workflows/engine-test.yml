name: Engine Test (lama.onnx — PC / Linux / Android-sim)

on:
  workflow_dispatch:
    inputs:
      use_fixes:
        description: 'test branch (fixes) — uncheck for main'
        type: boolean
        default: true
  push:
    branches: [test, main, mail]
    paths: ['manga.py', 'manga_sections/**', '.github/workflows/engine-test.yml']

permissions:
  contents: read

jobs:
  test-linux-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.use_fixes && 'test' || 'main' }}
          fetch-depth: 1
        if: github.event_name == 'workflow_dispatch'
      - name: Checkout (push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        if: github.event_name == 'push'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pillow onnxruntime \
            rapidocr-onnxruntime arabic-reshaper python-bidi

      - name: Download test images (7 لینکِ کاربر)
        run: |
          mkdir -p /tmp/mt/imgs /tmp/mt/out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img1.webp "https://cdn.asurascans.com/asura-images/chapters/what-a-bountiful-harvest-demon-lord/1/002.webp" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img2.webp "https://cdn.asurascans.com/asura-images/chapters/surviving-the-game-as-a-barbarian/2/012_p1.webp?v=1770499638" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img3.webp "https://cdn.asurascans.com/asura-images/chapters/raising-villains-the-right-way/51/412e9e.webp?v=1788462175" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img4.webp "https://cdn.asurascans.com/asura-images/chapters/pick-me-up-infinite-gacha/210/987bc5.webp?v=1784126417" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img5.webp "https://cdn.asurascans.com/asura-images/chapters/my-slain-dragon-bride/1/890fb1.webp?v=1787405548" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img6.jpg "https://raw.githubusercontent.com/amirwolf512k/Manga-AutoTranslate/main/examples/01.jpg" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img7.jpg "https://raw.githubusercontent.com/amirwolf512k/Manga-AutoTranslate/main/examples/IMG_20260929_025410_986.jpg" || true
          cp examples/before.jpg /tmp/mt/imgs/img8_before.jpg || true
          ls -la /tmp/mt/imgs

      - name: Run engine (PC path — RapidOCR + lama.onnx)
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          for f in /tmp/mt/imgs/*; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            MANGA_LAMA_PATCH_SIDE=384 timeout 600 \
              python3 manga.py -i "$f" -o /tmp/mt/out --clean-only \
              --font fonts/Vazir-Code.ttf --cpu --lama \
              --clean-method lama-manga --debug
            echo "=== exit: $? ==="
          done 2>&1 | tee /tmp/mt/pc.log | tail -60

      - name: Upload results (PC)
        uses: actions/upload-artifact@v4
        with:
          name: out-linux-pc
          path: |
            /tmp/mt/out/**
            /tmp/mt/pc.log
          if-no-files-found: warn
          retention-days: 10

  test-android-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.use_fixes && 'test' || 'main' }}
          fetch-depth: 1
        if: github.event_name == 'workflow_dispatch'
      - name: Checkout (push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        if: github.event_name == 'push'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pillow onnxruntime \
            rapidocr-onnxruntime arabic-reshaper python-bidi

      - name: Download test images
        run: |
          mkdir -p /tmp/mt/imgs /tmp/mt/out
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36"
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img1.webp "https://cdn.asurascans.com/asura-images/chapters/what-a-bountiful-harvest-demon-lord/1/002.webp" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img2.webp "https://cdn.asurascans.com/asura-images/chapters/surviving-the-game-as-a-barbarian/2/012_p1.webp?v=1770499638" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img3.webp "https://cdn.asurascans.com/asura-images/chapters/raising-villains-the-right-way/51/412e9e.webp?v=1788462175" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img4.webp "https://cdn.asurascans.com/asura-images/chapters/pick-me-up-infinite-gacha/210/987bc5.webp?v=1784126417" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img5.webp "https://cdn.asurascans.com/asura-images/chapters/my-slain-dragon-bride/1/890fb1.webp?v=1787405548" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img6.jpg "https://raw.githubusercontent.com/amirwolf512k/Manga-AutoTranslate/main/examples/01.jpg" || true
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/img7.jpg "https://raw.githubusercontent.com/amirwolf512k/Manga-AutoTranslate/main/examples/IMG_20260929_025410_986.jpg" || true
          ls -la /tmp/mt/imgs

      - name: Run engine (Android-sim — 2 هستهٔ ضعیف مثل گوشی)
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          for f in /tmp/mt/imgs/img1.webp /tmp/mt/imgs/img5.webp /tmp/mt/imgs/img7.jpg; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            MANGA_LAMA_PATCH_SIDE=384 OMP_NUM_THREADS=2 timeout 1500 \
              taskset -c 0,1 \
              python3 manga.py -i "$f" -o /tmp/mt/out --clean-only \
              --font fonts/Vazir-Code.ttf --cpu --lama \
              --clean-method lama-manga --debug
            echo "=== exit: $? ==="
          done 2>&1 | tee /tmp/mt/android.log | tail -60

      - name: Upload results (Android-sim)
        uses: actions/upload-artifact@v4
        with:
          name: out-android-sim
          path: |
            /tmp/mt/out/**
            /tmp/mt/android.log
          if-no-files-found: warn
          retention-days: 10
