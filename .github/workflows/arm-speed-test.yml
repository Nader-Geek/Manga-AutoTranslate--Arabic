name: ARM Real Speed Test (phone-config — 01.jpg)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['manga.py', 'manga_sections/**', '.github/workflows/arm-speed-test.yml']

permissions:
  contents: read

jobs:
  arm-speed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pillow onnxruntime \
            rapidocr-onnxruntime arabic-reshaper python-bidi

      - name: Show ARM hardware
        run: |
          echo "cores: $(nproc) | arch: $(uname -m)"
          lscpu | grep -E "Model name|MHz|CPU\(s\):" | head -5
          free -h

      - name: Download 01.jpg
        run: |
          mkdir -p /tmp/mt/imgs /tmp/mt/out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          curl -sL --max-time 120 -A "$UA" -o /tmp/mt/imgs/01.jpg \
            "https://raw.githubusercontent.com/amirwolf512k/Manga-AutoTranslate/main/examples/01.jpg"
          ls -la /tmp/mt/imgs

      - name: Speed sweep (W1 / W2 / W6 — phone-like env)
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          : > /tmp/mt/speed.log
          run_one() {
            local label="$1"; local workers="$2"; local othreads="$3"
            local outdir="/tmp/mt/out/$label"
            mkdir -p "$outdir"
            echo "" | tee -a /tmp/mt/speed.log
            echo "########## $label (workers=$workers ort_threads=$othreads) ##########" | tee -a /tmp/mt/speed.log
            local t0=$(date +%s.%N)
            # v1.14.120 — paddlelite حذف شد؛ این تست حالا موتورِ ONNXِ
            # هم-مقیاسِ موبایل (RapidOCR — همان زنجیرهٔ فال‌بکِ اندروید) را
            # میسنجد؛ مدلِ lama و پاکسازی بدونِ تغییر.
            MANGA_OCR_WORKERS="$workers" \
            MANGA_ORT_THREADS="$othreads" \
            MANGA_LOW_MEM=1 \
            MANGA_LAMA_PATCH_SIDE=384 \
            timeout 900 python3 manga.py -i /tmp/mt/imgs/01.jpg -o "$outdir" \
              --font fonts/Vazir-Code.ttf --cpu --fake-translate \
              --clean-method lama-manga --ocr-lang en --debug --no-resume \
              > "/tmp/mt/run_$label.log" 2>&1
            local rc=$?
            local t1=$(date +%s.%N)
            local wall=$(python3 -c "print(f'{$t1-$t0:.1f}')")
            echo "### $label wall=${wall}s exit=$rc" | tee -a /tmp/mt/speed.log
            grep -E "\[TIME\]|\[\*\] OCR|workers=" "/tmp/mt/run_$label.log" | tail -40 | tee -a /tmp/mt/speed.log
            grep -cE "ناحیه rect=" "/tmp/mt/run_$label.log" | xargs -I{} echo "### $label regions_extracted={}" | tee -a /tmp/mt/speed.log
          }
          run_one W2 2 2
          run_one W1 1 4
          run_one W6 6 2
          cat /tmp/mt/speed.log

      - name: LaMa clean-only sweep (DFT vs noFFT — ARM real)
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          : > /tmp/mt/lama.log
          lama_one() {
            local label="$1"; local nofft="$2"
            local outdir="/tmp/mt/out/$label"
            mkdir -p "$outdir"
            echo "########## $label (MANGA_LAMA_NOFFT=$nofft) ##########" | tee -a /tmp/mt/lama.log
            local t0=$(date +%s.%N)
            MANGA_LAMA_NOFFT="$nofft" MANGA_ORT_THREADS=4 MANGA_LOW_MEM=1 \
            MANGA_LAMA_PATCH_SIDE=384 timeout 900 \
              python3 manga.py -i /tmp/mt/imgs/01.jpg -o "$outdir" \
              --font fonts/Vazir-Code.ttf --cpu --lama --clean-only \
              --clean-method lama-manga --debug --no-resume \
              > "/tmp/mt/lama_$label.log" 2>&1
            local rc=$?
            local t1=$(date +%s.%N)
            echo "### $label wall=$(python3 -c "print(f'{$t1-$t0:.1f}')")s exit=$rc" | tee -a /tmp/mt/lama.log
            grep -E "\[TIME\]" "/tmp/mt/lama_$label.log" | tail -8 | tee -a /tmp/mt/lama.log
          }
          lama_one DFT 0
          lama_one NOFFT 1
          cat /tmp/mt/lama.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## ARM (ubuntu-24.04-arm, $(nproc) cores) — 01.jpg — phone-like config"
            echo '```'
            grep -E "##########|wall=|\[TIME\] total=|clean\+render|regions_extracted" /tmp/mt/speed.log || true
            echo '```'
            echo "## LaMa clean-only (DFT vs noFFT — ARM)"
            echo '```'
            grep -E "##########|wall=|\[TIME\]" /tmp/mt/lama.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-speed-logs
          path: |
            /tmp/mt/speed.log
            /tmp/mt/lama.log
            /tmp/mt/run_*.log
            /tmp/mt/lama_*.log
            /tmp/mt/out/**
          if-no-files-found: warn
          retention-days: 10
