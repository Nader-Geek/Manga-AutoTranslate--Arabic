name: Build Android APK

# ساختِ خودکارِ APK — درخواستِ کاربر (v1.14.59):
# هر تغییر در موتور/اپ → سه APK (arm64 / armv7a / universal) ساخته و
# رویِ ریلیزِ `apk` می‌نشیند (همان لینک‌هایِ داخلِ VERSION که گوشی
# برایِ «دانلود و نصب» استفاده می‌کند).
# نکته: abiFilters داخلِ یک APK می‌نشیند → هر بیلد یک app-debug.apk
# می‌دهد که بلافاصله با نامِ مقصد کپی می‌شود.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "manga.py"
      - "manga_app.py"
      - "VERSION"
      - "android/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Python 3.10 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch vendored Python packages
        run: |
          python3 android/scripts/fetch_vendor.py --check || \
            python3 android/scripts/fetch_vendor.py

      - name: Sync engine sources into APK
        run: python3 android/scripts/sync_sources.py

      # v1.14.184 — مدلهایِ رسمیِ PP-OCRv6_small (deploy/ppocr-android)
      # از HuggingFaceِ رسمیِ PaddlePaddle دانلود و در assets باندل
      # میشوند — رویِ گوشی هیچ دانلودِ زمانِ اجرایی نیست
      - name: Fetch official ppocr-android models (PP-OCRv6_small)
        run: |
          mkdir -p android/app/src/main/assets/models/det \
                   android/app/src/main/assets/models/rec
          curl -fL --retry 3 --max-time 600 \
            -o android/app/src/main/assets/models/det/inference.onnx \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/main/inference.onnx"
          curl -fL --retry 3 --max-time 600 \
            -o android/app/src/main/assets/models/rec/inference.onnx \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.onnx"
          curl -fL --retry 3 --max-time 600 \
            -o android/app/src/main/assets/models/rec/inference.yml \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.yml"
          ls -la android/app/src/main/assets/models/det android/app/src/main/assets/models/rec
          test $(stat -c%s android/app/src/main/assets/models/det/inference.onnx) -gt 5000000
          test $(stat -c%s android/app/src/main/assets/models/rec/inference.onnx) -gt 10000000
          test $(stat -c%s android/app/src/main/assets/models/rec/inference.yml) -gt 50000

      - name: Inject version from VERSION
        run: |
          VC=$(sed -n 's/^versionCode=//p' VERSION | tr -d '[:space:]')
          VN=$(sed -n 's/^versionName=//p' VERSION | tr -d '[:space:]')
          echo "versionCode=$VC versionName=$VN"
          sed -i -E "s/versionCode = .*/versionCode = $VC/; s/versionName = .*/versionName = \"$VN\"/" \
            android/app/build.gradle.kts
          sed -n '12,18p' android/app/build.gradle.kts

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build arm64 APK
        working-directory: android
        run: |
          gradle :app:assembleDebug -PappAbis="arm64-v8a" \
            -PchaquopyBuildPython="$(command -v python3)"
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/MangaTranslator-arm64.apk

      - name: Build armv7a APK
        working-directory: android
        run: |
          gradle :app:assembleDebug -PappAbis="armeabi-v7a" \
            -PchaquopyBuildPython="$(command -v python3)"
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/MangaTranslator-armv7a.apk

      - name: Build universal APK
        working-directory: android
        run: |
          gradle :app:assembleDebug -PappAbis="arm64-v8a,armeabi-v7a" \
            -PchaquopyBuildPython="$(command -v python3)"
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/MangaTranslator-universal.apk

      - name: Show sizes
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to release `apk`
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: apk
          overwrite_files: true
          files: |
            dist/MangaTranslator-arm64.apk
            dist/MangaTranslator-armv7a.apk
            dist/MangaTranslator-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
